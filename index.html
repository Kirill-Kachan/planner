[data-theme="sepia"]{
  --bg:#1a1510;--bg2:#221e17;--bg3:#2a251c;--bg4:#322c22;
  --bd:rgba(255,220,150,.07);--bd2:rgba(255,220,150,.13);
  --tx:#f0e6cc;--t2:#a09070;--t3:#6a5a40;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg)}
body{font-family:'Inter',sans-serif;color:var(--tx);max-width:960px;margin:0 auto;display:flex;flex-direction:column;transition:background .2s,color .2s}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit;color:var(--tx);background:var(--bg3)}

#app{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-bottom:calc(var(--nav-h) + 12px)}
#app::-webkit-scrollbar{width:4px}
#app::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:2px}

/* ── BOTTOM NAV ─────────────────────────────── */
/* ══ BOTTOM NAV ══════════════════════════════════════ */
.nav{
  position:fixed;bottom:14px;left:50%;
  transform:translateX(-50%) translateZ(0);
  -webkit-transform:translateX(-50%) translateZ(0);
  will-change:transform;
  width:calc(100% - 32px);max-width:420px;
  height:68px;
  border-radius:28px;
  padding:0 6px;
  display:flex;align-items:center;gap:4px;
  z-index:100;
  background:rgba(28,28,38,.28);
  backdrop-filter:saturate(180%) blur(28px);
  -webkit-backdrop-filter:saturate(180%) blur(28px);
  border:1px solid rgba(255,255,255,.12);
  box-shadow:0 1px 0 rgba(255,255,255,.05) inset;
}
[data-theme="light"] .nav{
  background:rgba(242,242,250,.72);
  border-color:rgba(0,0,0,.10);
}

/* Кнопки навигации — 3 равные */
.nvi{
  flex:1;height:54px;border-radius:20px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;cursor:pointer;
  color:rgba(255,255,255,.38);
  font-size:9px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
  background:transparent;border:1px solid transparent;
  transition:color .35s ease,background .35s ease,border-color .35s ease,transform .2s ease;
  -webkit-tap-highlight-color:transparent;
}
[data-theme="light"] .nvi{color:rgba(0,0,0,.35);}
.nvi.on{
  color:var(--acc);
  background:rgba(26,143,255,.15);
  border-color:rgba(26,143,255,.25);
}
.nvi:active{transform:scale(.91)}
.nvi-ic{width:24px;height:24px;display:flex;align-items:center;justify-content:center;}
.nvi-ic svg{width:100%;height:100%;transition:transform .35s ease}
.nvi.on .nvi-ic svg{transform:scale(1.08)}
.nvi-lbl{font-size:9px;font-weight:700;line-height:1}

/* Стрелка — такая же кнопка, flex:1 */
.nav-more-btn{
  flex:1;height:54px;border-radius:20px;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;
  color:rgba(255,255,255,.38);
  background:transparent;border:1px solid transparent;
  transition:color .35s ease,background .35s ease,border-color .35s ease,transform .2s ease;
  -webkit-tap-highlight-color:transparent;
}
[data-theme="light"] .nav-more-btn{color:rgba(0,0,0,.35);}
.nav-more-btn.on{
  color:var(--acc);
  background:rgba(26,143,255,.15);
  border-color:rgba(26,143,255,.25);
}
.nav-more-btn:active{transform:scale(.91)}
.nav-more-btn svg{width:22px;height:22px;}

/* ══ MORE MENU — идентично nav ══════════════════════ */
.more-menu{
  position:fixed;
  bottom:96px;
  left:50%;
  transform:translateX(-50%) translateZ(0);
  -webkit-transform:translateX(-50%) translateZ(0);
  will-change:transform;
  width:calc(100% - 32px);max-width:420px;
  border-radius:28px;
  padding:0 6px;
  height:68px;
  display:none;
  align-items:center;
  gap:4px;
  z-index:150;
  background:rgba(28,28,38,.28);
  backdrop-filter:saturate(180%) blur(28px);
  -webkit-backdrop-filter:saturate(180%) blur(28px);
  border:1px solid rgba(255,255,255,.12);
  box-shadow:0 1px 0 rgba(255,255,255,.05) inset;
  animation:slideUp .28s cubic-bezier(.4,0,.2,1);
}
[data-theme="light"] .more-menu{
  background:rgba(242,242,250,.72);
  border-color:rgba(0,0,0,.10);
}
.more-menu.on{display:flex}
@keyframes slideUp{
  from{opacity:0;transform:translateX(-50%) translateY(10px)}
  to{opacity:1;transform:translateX(-50%) translateY(0)}
}
.more-btn{
  flex:1;height:54px;border-radius:20px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  cursor:pointer;
  color:rgba(255,255,255,.55);
  background:transparent;border:1px solid transparent;
  transition:color .35s ease,background .35s ease,border-color .35s ease,transform .2s ease;
  -webkit-tap-highlight-color:transparent;
}
[data-theme="light"] .more-btn{color:rgba(0,0,0,.45);}
.more-btn:active{transform:scale(.91)}
.more-btn.on{
  color:var(--acc);
  background:rgba(26,143,255,.15);
  border-color:rgba(26,143,255,.25);
}
.more-ic{width:22px;height:22px;display:flex;align-items:center;justify-content:center;}
.more-ic svg{width:100%;height:100%}
.more-lbl{font-size:9px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;line-height:1}


/* ── PAGE HEADER ────────────────────────────── */
.ph{padding:52px 16px 0}
/* Page transition */
@keyframes pgIn{from{opacity:0;transform:translateY(22px) scale(.982)}to{opacity:1;transform:translateY(0) scale(1)}}
.pg,.ph,.ws-wrap,.qsbar,.cf-wrap{animation:pgIn .65s cubic-bezier(.4,0,.2,1)}
@keyframes fadeIn{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
.nav{animation:fadeIn .65s cubic-bezier(.4,0,.2,1)}
@media(min-width:600px){.ph{padding:24px 24px 0}}
.ph-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:2px}
.ph-label{font-size:11px;font-weight:700;color:var(--t3);letter-spacing:.1em;text-transform:uppercase}
.ph-acts{display:flex;gap:7px;align-items:center}
.ibtn{width:34px;height:34px;border-radius:50%;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;transition:background .15s;flex-shrink:0;border:none}
.ibtn:active{background:var(--bg4)}
.ph-h1{font-size:26px;font-weight:900;line-height:1.15;letter-spacing:-.5px}
.ph-sub{font-size:13px;color:var(--t2);margin-top:2px}

/* ── WEEK STRIP ─────────────────────────────── */
.ws-wrap{padding:14px 16px 0;user-select:none}
.ws-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.ws-nav{width:30px;height:30px;border-radius:50%;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;border:none;color:var(--tx)}
.ws-nav:active{background:var(--bg4)}
.ws-month{font-size:13px;font-weight:700;color:var(--t2)}
.ws-days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.dd{
  height:60px;border-radius:11px;background:var(--bg2);
  border:1.5px solid transparent;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:2px;
  cursor:pointer;transition:background .32s cubic-bezier(.4,0,.2,1),border-color .32s cubic-bezier(.4,0,.2,1),transform .2s cubic-bezier(.34,1.56,.64,1);position:relative;
}
.dd.sel{background:var(--bbg);border-color:var(--blu)}
.dd.tod .dn{color:var(--yel)}
.dd::after{content:'';position:absolute;bottom:5px;width:4px;height:4px;border-radius:50%;opacity:0;transition:opacity .13s}
.dd.has::after{opacity:1;background:var(--t3)}
.dd.sel.has::after{background:var(--blu)}
.dd.ovd::after{opacity:1;background:var(--red)}
.dw{font-size:9px;font-weight:800;color:var(--t3);text-transform:uppercase;letter-spacing:.05em}
.dn{font-size:16px;font-weight:900;color:var(--tx)}
.dd.sel .dw,.dd.sel .dn{color:var(--blu)}

/* ── QUICK STATS ────────────────────────────── */
.qsbar{display:flex;gap:7px;padding:10px 16px 0}
.qs{flex:1;background:var(--bg2);border-radius:10px;padding:8px 6px;text-align:center;border:1.5px solid var(--bd)}
.qs-n{font-size:18px;font-weight:900}
.qs-l{font-size:9px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.04em;margin-top:1px}

/* ── CATEGORY FILTER ────────────────────────── */
.cf-wrap{padding:10px 0 0;overflow-x:auto;scrollbar-width:none}
.cf-wrap::-webkit-scrollbar{display:none}
.cf-inner{display:flex;gap:6px;padding:0 16px;min-width:max-content}
.cfc{height:30px;padding:0 12px;border-radius:20px;background:var(--bg2);
  font-size:12px;font-weight:700;color:var(--t3);white-space:nowrap;
  cursor:pointer;border:1.5px solid transparent;display:flex;align-items:center;
  gap:5px;transition:all .13s;flex-shrink:0}
.cfc.on{background:var(--bbg);border-color:var(--acc);color:var(--acc);font-weight:800}

/* ── CAT INDICATOR (two-tone bar, no dots) ────── */
.cbar{width:3px;height:16px;border-radius:2px;flex-shrink:0}
.cbar-sub{width:3px;height:11px;border-radius:2px;flex-shrink:0;opacity:.55}

/* ── WEATHER ─────────────────────────────────── */
.weather-pill{
  display:flex;align-items:center;gap:9px;
  background:rgba(26,143,255,.10);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-radius:18px;padding:8px 14px;
  border:1px solid rgba(26,143,255,.20);cursor:pointer;
  transition:all .22s cubic-bezier(.4,0,.2,1);
}
.weather-pill:active{opacity:.7;transform:scale(.94)}
@keyframes float{0%,100%{transform:translateY(0) rotate(0deg)}33%{transform:translateY(-4px) rotate(-5deg)}66%{transform:translateY(-2px) rotate(3deg)}}
@keyframes glow{0%,100%{box-shadow:0 4px 20px rgba(26,143,255,.12),0 0 0 0 rgba(26,143,255,.0)}50%{box-shadow:0 4px 32px rgba(26,143,255,.28),0 0 20px rgba(26,143,255,.10)}}
.weather-pill{animation:glow 5s ease-in-out infinite}
@keyframes spin{0%,100%{transform:rotate(0deg) scale(1)}50%{transform:rotate(8deg) scale(1.05)}}
.weather-ic{font-size:32px;line-height:1;animation:float 5s ease-in-out infinite,spin 8s ease-in-out infinite;display:inline-block;filter:drop-shadow(0 2px 6px rgba(26,143,255,.3))}
.weather-temp{font-size:22px;font-weight:900;line-height:1;color:var(--tx)}
.weather-desc{font-size:10px;color:var(--t2);font-weight:700;margin-top:1px}

/* ── THEMES ─────────────────────────────────── */
[data-theme="light"]{--bg:#f0f0f5;--bg2:#fff;--bg3:#f5f5fa;--bg4:#e8e8f0;--bd:rgba(0,0,0,.07);--bd2:rgba(0,0,0,.12);--tx:#1a1a2e;--t2:#555570;--t3:#9090a8;}
[data-theme="sepia"]{--bg:#18140e;--bg2:#221c14;--bg3:#2a231a;--bg4:#332b1f;--bd:rgba(255,220,150,.07);--bd2:rgba(255,220,150,.14);--tx:#f0e6cc;--t2:#a09070;--t3:#6a5a40;}
[data-theme="amoled"]{--bg:#000;--bg2:#0a0a0a;--bg3:#111;--bg4:#1a1a1a;--bd:rgba(255,255,255,.05);--bd2:rgba(255,255,255,.09);--tx:#fff;--t2:#808080;--t3:#404040;}
[data-theme="ocean"]{--bg:#060e1a;--bg2:#0b1829;--bg3:#102035;--bg4:#162840;--bd:rgba(100,200,255,.07);--bd2:rgba(100,200,255,.13);--tx:#cce8ff;--t2:#6090b0;--t3:#304558;--acc:#00bfff;--blu:#00bfff;--bbg:rgba(0,191,255,.13);}
[data-theme="forest"]{--bg:#080f08;--bg2:#101810;--bg3:#182018;--bg4:#202820;--bd:rgba(100,200,100,.07);--bd2:rgba(100,200,100,.13);--tx:#d0f0d0;--t2:#608060;--t3:#304030;--acc:#4caf50;--grn:#4caf50;--blu:#4caf50;--bbg:rgba(76,175,80,.13);--gbg:rgba(76,175,80,.13);}
[data-theme="pink"]{--bg:#120a10;--bg2:#1c1018;--bg3:#241420;--bg4:#2e1a28;--bd:rgba(255,100,180,.07);--bd2:rgba(255,100,180,.14);--tx:#ffe0f0;--t2:#c080a8;--t3:#7a4060;--acc:#ff69b4;--blu:#ff69b4;--bbg:rgba(255,105,180,.13);}
[data-theme="nord"]{--bg:#2e3440;--bg2:#3b4252;--bg3:#434c5e;--bg4:#4c566a;--bd:rgba(216,222,233,.08);--bd2:rgba(216,222,233,.14);--tx:#eceff4;--t2:#d8dee9;--t3:#9099aa;--acc:#88c0d0;--blu:#88c0d0;--bbg:rgba(136,192,208,.13);}
[data-theme="mocha"]{--bg:#1e1e2e;--bg2:#181825;--bg3:#1e1e2e;--bg4:#313244;--bd:rgba(205,214,244,.06);--bd2:rgba(205,214,244,.12);--tx:#cdd6f4;--t2:#a6adc8;--t3:#6c7086;--acc:#cba6f7;--blu:#cba6f7;--bbg:rgba(203,166,247,.13);}
[data-theme="sunset"]{--bg:#120810;--bg2:#1c1020;--bg3:#241828;--bg4:#2e2032;--bd:rgba(255,100,50,.07);--bd2:rgba(255,100,50,.13);--tx:#ffeedd;--t2:#c08070;--t3:#7a5040;--acc:#ff7043;--blu:#ff7043;--bbg:rgba(255,112,67,.13);}
[data-theme="midnight"]{--bg:#05050f;--bg2:#0d0d1f;--bg3:#12122a;--bg4:#181833;--bd:rgba(120,80,255,.08);--bd2:rgba(120,80,255,.16);--tx:#e8e0ff;--t2:#8878cc;--t3:#443c77;--acc:#7c4dff;--blu:#7c4dff;--bbg:rgba(124,77,255,.13);}
[data-theme="slate"]{--bg:#0f1117;--bg2:#171923;--bg3:#1e2130;--bg4:#262a3d;--bd:rgba(180,190,220,.07);--bd2:rgba(180,190,220,.13);--tx:#e2e8f0;--t2:#8090aa;--t3:#404858;--acc:#60a5fa;--blu:#60a5fa;--bbg:rgba(96,165,250,.13);}

/* ── SPORT CARDS ─────────────────────────────── */
.wk-card{border-radius:var(--r);margin-bottom:8px;border:1.5px solid var(--bd);overflow:hidden}
.wk-hdr{display:flex;align-items:center;gap:10px;padding:13px 14px;cursor:pointer;background:var(--bg2);transition:background .13s}
.wk-hdr:active{background:var(--bg3)}
.wk-date{font-size:12px;font-weight:800;color:var(--t2);min-width:52px}
.wk-type{font-size:14px;font-weight:700;flex:1;color:var(--tx)}
.wk-cnt{font-size:11px;color:var(--t3);font-weight:600}
.wk-dyn{font-size:14px;font-weight:900;margin-left:4px}
.wk-chevron{font-size:14px;color:var(--t3);margin-left:4px;transition:transform .2s}
.wk-chevron.open{transform:rotate(180deg)}
.wk-body{background:var(--bg2);border-top:1px solid var(--bd);padding:10px 14px 12px;display:none}
.wk-body.open{display:block}
.wk-ex{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--bd);gap:8px}
.wk-ex:last-child{border-bottom:none}
.wk-ex-name{font-size:14px;font-weight:700;color:var(--tx);margin-bottom:3px}
.wk-ex-prev{font-size:11px;color:var(--t2);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px}
.wk-pills{display:flex;gap:4px;flex-wrap:nowrap;justify-content:flex-end;flex-shrink:0;min-width:0}
.wpill{background:var(--bg3);border-radius:7px;padding:4px 8px;font-size:11px;font-weight:800;color:var(--t2);white-space:nowrap}
.wpill.up{color:var(--grn);background:var(--gbg)}.wpill.dn{color:var(--red);background:var(--rbg)}
.wk-edit-btn{width:100%;height:38px;border-radius:10px;background:var(--bg3);color:var(--t2);font-size:13px;font-weight:700;border:1.5px solid var(--bd2);cursor:pointer;font-family:inherit;margin-top:10px}

/* ── AUTO ────────────────────────────────────── */
.auto-task{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--bd);cursor:pointer}
.auto-task:last-child{border-bottom:none}
.auto-task:active{opacity:.7}
.auto-pbar{width:3px;height:36px;border-radius:2px;flex-shrink:0}
.auto-svc-entry{background:var(--bg2);border-radius:var(--r);padding:13px;margin-bottom:8px;border:1.5px solid var(--bd)}
.auto-svc-km{font-size:16px;font-weight:900;color:var(--yel);background:var(--ybg);padding:3px 10px;border-radius:8px;white-space:nowrap}

/* ── REPORT ──────────────────────────────────── */
.rc{background:var(--bg2);border-radius:var(--r);padding:13px;margin-bottom:9px;border:1.5px solid var(--bd)}
.rc-t{font-size:11px;font-weight:800;color:var(--t2);text-transform:uppercase;letter-spacing:.07em;margin-bottom:10px}
.rs-row{display:flex;gap:7px}
.rs{flex:1;background:var(--bg3);border-radius:10px;padding:9px 6px;text-align:center}
.rs-n{font-size:20px;font-weight:900}
.rs-l{font-size:9px;color:var(--t3);font-weight:700;text-transform:uppercase;margin-top:2px}
.rbar{height:4px;border-radius:2px;background:var(--bg3);margin:6px 0;overflow:hidden}
.rbar-f{height:100%;border-radius:2px}
.ri{display:flex;align-items:center;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--bd);cursor:pointer}
.ri:last-child{border-bottom:none}
.chart-wrap{overflow-x:auto;scrollbar-width:none;padding:4px 0 8px}
.chart-wrap::-webkit-scrollbar{display:none}

/* ── DONE CARD ───────────────────────────────── */
.done-card{background:var(--bg2);border-radius:var(--r);padding:11px 13px;margin-bottom:6px;border:1.5px solid var(--bd);display:flex;align-items:flex-start;gap:10px;cursor:pointer}
.done-chk{width:20px;height:20px;border-radius:6px;background:var(--gbg);border:1.5px solid var(--grn);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--grn);font-weight:900;margin-top:1px}
.done-body{flex:1;min-width:0}
.done-title{font-size:13px;font-weight:600;color:var(--t2);text-decoration:line-through;word-break:break-word}
.done-meta{font-size:10px;color:var(--t3);margin-top:3px;display:flex;gap:6px;flex-wrap:wrap}

/* ── SETTINGS ────────────────────────────────── */
.set-block{background:var(--bg2);border-radius:var(--r);padding:0 16px;border:1.5px solid var(--bd);margin-bottom:12px}
.set-row{display:flex;align-items:center;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--bd)}
.set-row:last-child{border-bottom:none}
.set-l{font-size:13px;font-weight:600}
.set-s{font-size:11px;color:var(--t3);margin-top:2px}
.cat-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--bd)}
.cat-row:last-child{border-bottom:none}
.cat-del{width:26px;height:26px;border-radius:8px;background:var(--rbg);color:var(--red);display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;flex-shrink:0;font-weight:800;border:none}
.tgl{width:42px;height:23px;border-radius:12px;background:var(--bg4);position:relative;cursor:pointer;transition:background .18s;flex-shrink:0}
.tgl.on{background:var(--blu)}
.tgl::after{content:'';width:17px;height:17px;border-radius:50%;background:#fff;position:absolute;top:3px;left:3px;transition:transform .18s}
.tgl.on::after{transform:translateX(19px)}
.theme-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:4px}
.theme-btn{height:56px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;border:2px solid transparent;transition:all .13s}
.theme-btn.on{border-color:var(--acc)}
.theme-btn-l{font-size:10px;font-weight:700;color:var(--t2)}

/* ── GUIDE ───────────────────────────────────── */
.g-sec{background:var(--bg2);border-radius:var(--r);padding:13px;margin-bottom:8px;border:1.5px solid var(--bd)}
.g-t{font-size:14px;font-weight:800;margin-bottom:9px}
.g-p{font-size:12px;color:var(--t2);line-height:1.65;margin-bottom:5px}
.g-step{display:flex;gap:9px;align-items:flex-start;margin-bottom:7px}
.g-num{width:20px;height:20px;border-radius:50%;background:var(--bbg);color:var(--blu);font-size:10px;font-weight:900;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.g-txt{font-size:12px;color:var(--t2);line-height:1.55;flex:1}

/* ── TOAST ───────────────────────────────────── */

@media(min-width:600px){:root{--nav-h:80px}.nav{width:calc(100% - 48px)}}

/* ── TASK CARD ───────────────────────────────── */
.tc{background:var(--bg2);border-radius:var(--r);padding:11px 12px;margin-bottom:6px;

.s0{background:var(--bg4);color:var(--t2)}.s1{background:var(--ybg);color:var(--yel)}
.s2{background:var(--bbg);color:var(--blu)}.s3{background:var(--gbg);color:var(--grn)}

.btn-s{margin:2px 16px 6px;width:calc(100% - 32px);height:48px;border-radius:12px;

/* ── REPORT ──────────────────────────────────── */
.rc{background:var(--bg2);border-radius:var(--r);padding:13px;margin-bottom:9px;border:1.5px solid var(--bd)}

/* ── WORKOUT ─────────────────────────────────── */

/* ── AUTO ────────────────────────────────────── */

/* ── DONE PAGE ───────────────────────────────── */
.done-card{background:var(--bg2);border-radius:var(--r);padding:11px 13px;margin-bottom:6px;
  border:1.5px solid var(--bd);display:flex;align-items:flex-start;gap:10px;cursor:pointer}

  flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--grn);font-weight:900;margin-top:1px}

/* ── SETTINGS ────────────────────────────────── */

.cat-row:last-child{border-bottom:none}
.cat-del{width:26px;height:26px;border-radius:8px;background:var(--rbg);color:var(--red);
  display:flex;align-items:center;justify-content:center;font-size:14px;cursor:pointer;flex-shrink:0;font-weight:800;border:none}
.tgl{width:42px;height:23px;border-radius:12px;background:var(--bg4);position:relative;cursor:pointer;transition:background .18s;flex-shrink:0}
.tgl.on{background:var(--blu)}
.tgl::after{content:'';width:17px;height:17px;border-radius:50%;background:#fff;position:absolute;top:3px;left:3px;transition:transform .18s}
.tgl.on::after{transform:translateX(19px)}

/* ── GUIDE ───────────────────────────────────── */
.g-sec{background:var(--bg2);border-radius:var(--r);padding:13px;margin-bottom:8px;border:1.5px solid var(--bd)}
.g-t{font-size:14px;font-weight:800;margin-bottom:9px}

.g-num{width:20px;height:20px;border-radius:50%;background:var(--bbg);color:var(--blu);
  font-size:10px;font-weight:900;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.g-txt{font-size:12px;color:var(--t2);line-height:1.55;flex:1}

/* ── CHART ───────────────────────────────────── */
.chart-wrap{padding:4px 0 8px;overflow-x:auto;scrollbar-width:none}
.chart-wrap::-webkit-scrollbar{display:none}
.bar-chart{display:flex;align-items:flex-end;gap:4px;height:80px;padding:0 4px}
.bar-col{display:flex;flex-direction:column;align-items:center;gap:3px;flex:1;min-width:28px}
.bar{border-radius:4px 4px 0 0;width:100%;transition:height .4s;min-height:3px}
.bar-lbl{font-size:8px;color:var(--t3);font-weight:700;text-align:center}

/* ── TOAST ───────────────────────────────────── */
.toast{position:fixed;top:56px;left:50%;transform:translateX(-50%) translateY(-10px);
  background:rgba(38,38,47,.96);border:1px solid var(--bd2);color:var(--tx);
  padding:9px 16px;border-radius:12px;font-size:12px;font-weight:700;z-index:999;
  opacity:0;transition:all .25s;pointer-events:none;white-space:nowrap}

/* ── TABLET / DESKTOP ────────────────────────── */
@media(min-width:600px){
  :root{--nav-h:80px}
  .dd{height:68px}
  .ws-wrap{padding:16px 24px 0}

}

  #app{display:grid;grid-template-columns:340px 1fr;grid-template-rows:auto 1fr;gap:0;align-items:start}
  .ph{grid-column:1/-1}
  .left-col{grid-column:1;grid-row:2}

}

<body>
<div id="app"></div>
<nav class="nav" id="nav"></nav>
<div id="moreMenu" class="more-menu"></div>
<button class="fab" id="fab">＋</button>
<div class="ovl" id="ovl"><div class="sht" id="sht"></div></div>
<div class="toast" id="toast"></div>
<script>
// ═══════════════════════════════════════════════════════════
// CONSTANTS
// ═══════════════════════════════════════════════════════════
const DEFAULT_CATS=[
  {id:'tasks',    l:'Задачи',        c:'#1a8fff',bg:'rgba(26,143,255,.13)', parent:null},
  {id:'work',     l:'Работа',        c:'#90a4ae',bg:'rgba(144,164,174,.13)',parent:null},
  {id:'health',   l:'Здоровье',      c:'#ff3b50',bg:'rgba(255,59,80,.13)',  parent:null},
  {id:'auto',     l:'Авто',          c:'#e8c84a',bg:'rgba(232,200,74,.13)', parent:null},
  {id:'ideas',    l:'Размышления',   c:'#69f0ae',bg:'rgba(105,240,174,.13)',parent:null},
  {id:'shopping', l:'Покупки',       c:'#ff6b9d',bg:'rgba(255,107,157,.13)',parent:null},
  {id:'other',    l:'Прочее',        c:'#78909c',bg:'rgba(120,144,156,.13)',parent:null},
  {id:'payments', l:'Оплаты',        c:'#ffaa00',bg:'rgba(255,170,0,.13)',  parent:'tasks'},
  {id:'calls',    l:'Звонки',        c:'#26d467',bg:'rgba(38,212,103,.13)', parent:'tasks'},
  {id:'mail',     l:'Письма',        c:'#9b8dff',bg:'rgba(155,141,255,.13)',parent:'tasks'},
  {id:'docs',     l:'Документы',     c:'#ff7043',bg:'rgba(255,112,67,.13)', parent:'tasks'},
  {id:'comms',    l:'Коммуникация',  c:'#ff6348',bg:'rgba(255,99,72,.13)',  parent:'tasks'},
  {id:'questions',l:'Вопросы',       c:'#64b5f6',bg:'rgba(100,181,246,.13)',parent:'work'},
  {id:'finance',  l:'Финансы',       c:'#ffd54f',bg:'rgba(255,213,79,.13)', parent:'work'},
];
const WORKOUT_TYPES=[
  {id:'chest', l:'Грудь / Трицепс', svgId:'chest'},
  {id:'back',  l:'Спина / Бицепс',  svgId:'back'},
  {id:'legs',  l:'Ноги',            svgId:'legs'},
  {id:'arms',  l:'Руки',            svgId:'arms'},
  {id:'cardio',l:'Кардио',          svgId:'cardio'},
  {id:'full',  l:'Фулл-боди',       svgId:'full'},
];
const PRIOS=[
  {id:'red',   c:'#ff3b50',bg:'rgba(255,59,80,.15)',  l:'Высокий'},
  {id:'yellow',c:'#ffaa00',bg:'rgba(255,170,0,.15)',  l:'Средний'},
  {id:'green', c:'#26d467',bg:'rgba(38,212,103,.15)', l:'Низкий'},
  {id:'blue',  c:'#1a8fff',bg:'rgba(26,143,255,.15)', l:'Инфо'},
];
const STATS=[
  {id:'todo',l:'К выполнению',cls:'s0'},{id:'doing',l:'В процессе',cls:'s1'},
  {id:'wait',l:'Ожидаю ответа',cls:'s2'},{id:'done',l:'Выполнено',cls:'s3'},{id:'over',l:'Просрочено',cls:'s4'},
];
const RUD=['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];
const RUDF=['Воскресенье','Понедельник','Вторник','Среда','Четверг','Пятница','Суббота'];
const RUM=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const RUMF=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const RUMS=['Янв','Фев','Мар','Апр','Май','Июн','Июл','Авг','Сен','Окт','Ноя','Дек'];
const PCLS={red:'pr',yellow:'py',green:'pg',blue:'pb'};
const $=id=>document.getElementById(id);
const today=()=>new Date().toISOString().slice(0,10);
const addDays=(n,base)=>{const d=base?new Date(base+'T00:00:00'):new Date();d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
const tomorrow=()=>addDays(1);

function fmtD(s){
  if(!s)return'';
  const d=new Date(s+'T00:00:00'),t=today(),tm=tomorrow(),y=addDays(-1);
  if(s===t)return'Сегодня';if(s===tm)return'Завтра';if(s===y)return'Вчера';
  return d.getDate()+' '+RUM[d.getMonth()];
}
function fmtDFull(s){if(!s)return'';const d=new Date(s+'T00:00:00');return d.getDate()+' '+RUM[d.getMonth()]+' '+d.getFullYear();}
function fmtDT(ts){if(!ts)return'';const d=new Date(ts);return d.getDate()+' '+RUMS[d.getMonth()]+' '+pad(d.getHours())+':'+pad(d.getMinutes());}
function pad(n){return String(n).padStart(2,'0')}
function isOver(t){return t.dl&&t.s!=='done'&&t.dl<today()}
function plural(n,a,b,c){if(n%10===1&&n%100!==11)return a;if([2,3,4].includes(n%10)&&![12,13,14].includes(n%100))return b;return c;}
function getMondayOf(dateStr){
  const d=new Date(dateStr+'T00:00:00'),dow=d.getDay();
  d.setDate(d.getDate()-(dow===0?6:dow-1));
  return d.toISOString().slice(0,10);
}

// ═══════════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════════
let A={
  nav:'tasks',
  selDate:today(),
  weekOffset:0,
  filterCat:'all',
  edit:null,
  tasks:[],workouts:[],reminders:{},
  cats:[...DEFAULT_CATS],
  notion:{key:'',dbId:''},
  theme:'dark',
  weather:null,
};

function getCat(id){return A.cats.find(c=>c.id===id)||A.cats[A.cats.length-1]}
function getPrio(id){return PRIOS.find(p=>p.id===id)||PRIOS[1]}
function getStat(id){return STATS.find(s=>s.id===id)||STATS[0]}
function mainCats(){return A.cats.filter(c=>!c.parent&&c.id!=='auto'&&c.id!=='ideas')}
function subCats(pid){return A.cats.filter(c=>c.parent===pid)}

function loadState(){
  try{
    // Читаем все возможные ключи — берём тот где больше задач
    let best={};
    let bestTasks=0;
    ['pln6','pln5','pln4','pln3','pln2','pln1'].forEach(k=>{
      try{
        const raw=localStorage.getItem(k);
        if(!raw) return;
        const d=JSON.parse(raw);
        const cnt=(d.tasks||[]).length;
        if(cnt>bestTasks){bestTasks=cnt;best=d;}
      }catch(e){}
    });
    const d=best;
    A.tasks=d.tasks&&d.tasks.length?d.tasks:seedTasks();
    A.workouts=d.workouts&&d.workouts.length?d.workouts:seedWorkouts();
    A.reminders=d.reminders||{};
    A.cats=d.cats&&d.cats.length?d.cats:[...DEFAULT_CATS];
    A.notion=d.notion||{key:'',dbId:''};
    A.theme=d.theme||'dark';
    A.autoTasks=d.autoTasks&&d.autoTasks.length?d.autoTasks:seedAutoTasks();
    A.autoService=d.autoService&&d.autoService.length?d.autoService:seedAutoService();
    A.workoutTypes=d.workoutTypes&&d.workoutTypes.length?d.workoutTypes:[...WORKOUT_TYPES];
    A.memos=d.memos||[];
  }catch(e){
    A.tasks=seedTasks();A.workouts=seedWorkouts();
    A.autoTasks=seedAutoTasks();A.autoService=seedAutoService();
    A.workoutTypes=[...WORKOUT_TYPES];A.memos=[];
  }
  applyTheme(A.theme);
}
function saveState(){
  localStorage.setItem('pln6',JSON.stringify({
    tasks:A.tasks,workouts:A.workouts,reminders:A.reminders,
    cats:A.cats,notion:A.notion,theme:A.theme,

function applyTheme(t){
  A.theme=t;
  document.body.dataset.theme=t==='dark'?'':t;
  const bgMap={dark:'#0d0d10',light:'#f0f0f5',sepia:'#18140e',amoled:'#000',ocean:'#060e1a',forest:'#080f08',pink:'#120a10',nord:'#2e3440',mocha:'#1e1e2e',sunset:'#120810',midnight:'#05050f',slate:'#0f1117'};

  saveState();
  // Re-render to update active theme button
  if(A.nav==='settings') render();
}

// WEEK NAVIGATION
// ═══════════════════════════════════════════════════════════
function getWeekDates(offset){
  const now=new Date();
  const dow=now.getDay();
  const monday=new Date(now);
  monday.setDate(now.getDate()-(dow===0?6:dow-1)+offset*7);
  const days=[];
  for(let i=0;i<7;i++){
    const d=new Date(monday);d.setDate(monday.getDate()+i);
    days.push(d.toISOString().slice(0,10));
  }
  return days;
}

function getWeekLabel(offset){
  const days=getWeekDates(offset);
  const first=new Date(days[0]+'T00:00:00');
  const last=new Date(days[6]+'T00:00:00');
  if(first.getMonth()===last.getMonth())
    return RUMF[first.getMonth()]+' '+first.getFullYear();
  return RUMS[first.getMonth()]+' – '+RUMS[last.getMonth()]+' '+last.getFullYear();
}

function render(){
  const app=$('app');
  // FAB visible on tasks, workouts, auto, notes
  const showFab=['tasks','workouts','auto','memos'].includes(A.nav);
  $('fab').style.display=showFab?'flex':'none';
  $('fab').onclick=
    A.nav==='workouts'?openNewWorkout:
    A.nav==='auto'?openAutoTask:
    A.nav==='memos'?openNewMemo:openNew;

  if(A.nav==='tasks')         app.innerHTML=pgTasks();
  else if(A.nav==='workouts') app.innerHTML=pgWorkouts();
  else if(A.nav==='auto')     app.innerHTML=pgAuto();
  else if(A.nav==='report')   app.innerHTML=pgReport();
  else if(A.nav==='settings') app.innerHTML=pgSettings();

  else if(A.nav==='guide')    app.innerHTML=pgGuide();
  else if(A.nav==='memos')    app.innerHTML=pgMemos();
  renderNav();
  renderMoreMenu();
  bind();
}

// Тоннаж упражнения = повторения × вес (если вес 0 — только повторения)
function exVol(ex){
  if(ex.mixedW&&ex.sets){
    return ex.sets.reduce((s,x)=>s+(x.w>0?x.r*x.w:x.r),0);
  }
  if(ex.mixed&&Array.isArray(ex.r)){
    const rSum=ex.r.reduce((s,r)=>s+r,0);
    return ex.w>0?rSum*ex.w:rSum;
  }
  return ex.w>0?ex.s*ex.r*ex.w:ex.s*ex.r;
}
// Полный тоннаж тренировки
function wVol(w){return w.exs.reduce((s,e)=>s+exVol(e),0);}

// Объединяет дублирующиеся упражнения подряд в одну строку
// Одинаковый вес: [{n,s:1,r:12,w:25},{n,s:1,r:10,w:25}] → {n,s:2,r:[12,10],w:25,mixed:true}
// Разный вес:    [{n,s:1,r:12,w:20},{n,s:1,r:10,w:25}] → {n,s:2,sets:[{r:12,w:20},{r:10,w:25}],mixed:true,mixedW:true}
function groupExs(exs){
  const result=[];
  exs.forEach(ex=>{
    const last=result[result.length-1];
    if(last&&last.n===ex.n&&!ex.mixed&&!ex.mixedW&&!last.mixed&&!last.mixedW){
      if(!last.mixed){
        last.mixed=true;
        // Проверяем был ли вес разный уже
        if(last.w!==ex.w){
          last.mixedW=true;
          last.sets=[{r:last.r,w:last.w},{r:ex.r,w:ex.w}];
        } else {
          last.r=[last.r,ex.r];
        }
      } else if(last.mixedW){
        last.sets.push({r:ex.r,w:ex.w});
      } else if(last.w!==ex.w){
        // Стал разный вес
        last.mixedW=true;
        last.sets=last.r.map(r=>({r,w:last.w}));
        last.sets.push({r:ex.r,w:ex.w});
      } else {
        last.r.push(ex.r);
      }
      last.s=(last.s||1)+1;
    } else {
      result.push({...ex});
    }
  });
  return result;
}

// Форматирует отображение подходов компактно
// Одинаковый вес: 3×12/10/8   Разный: 12×20/10×25/8×30кг   Обычный: 3×10
function fmtEx(ex){
  if(ex.mixedW&&ex.sets){
    return ex.sets.map(s=>s.r+'×'+s.w).join('/')+'кг';
  }
  if(ex.mixed&&Array.isArray(ex.r)){
    return ex.s+'×'+ex.r.join('/');
  }
  return ex.s+'×'+ex.r;
}
// Для строки "Пред"
function fmtExPrev(ex){
  if(ex.mixedW&&ex.sets){
    // Компактно: если все r одинаковые — Nx R (W1/W2кг), иначе просто Nx подх
    const ws=ex.sets.map(s=>s.w);
    const rs=ex.sets.map(s=>s.r);
    const allSameR=rs.every(r=>r===rs[0]);
    if(allSameR) return ex.s+'×'+rs[0]+' ('+[...new Set(ws)].join('/')+'кг)';
    return ex.s+' подх · разн.';
  }
  if(ex.mixed&&Array.isArray(ex.r)) return ex.s+'×'+ex.r.join('/')+(ex.w>0?' · '+ex.w+'кг':'');
  return ex.s+'×'+ex.r+(ex.w>0?' · '+ex.w+'кг':'');
}

  function buildCard(w, defaultOpen){
    const isOpen=A._expandedWk.has(w.id)||defaultOpen;
    const prev=A.workouts.filter(x=>x.type===w.type&&x.date<w.date).sort((a,b)=>b.date.localeCompare(a.date))[0];
    // Сравниваем только общие упражнения (которые есть в обеих тренировках)
    let volC=0, volP=0;
    if(prev){
      const prevNames=new Set(prev.exs.map(e=>e.n));
      const curNames=new Set(w.exs.map(e=>e.n));
      const common=[...curNames].filter(n=>prevNames.has(n));
      if(common.length>0){
        volC=w.exs.filter(e=>common.includes(e.n)).reduce((s,e)=>s+exVol(e),0);
        volP=prev.exs.filter(e=>common.includes(e.n)).reduce((s,e)=>s+exVol(e),0);
      } else {
        // Нет общих — сравниваем всё
        volC=wVol(w); volP=wVol(prev);
      }
    }
    const dyn=prev?(volC>volP?`<span class="wk-dyn" style="color:var(--grn)">↑</span>`:volC<volP?`<span class="wk-dyn" style="color:var(--red)">↓</span>`:''):'';    const d=new Date(w.date+'T00:00:00');
    const dateStr=d.getDate()+'.'+pad(d.getMonth()+1)+'.'+String(d.getFullYear()).slice(2);
    const{svgId,label:typeName}=getWtInfo(w.type);

    let body='';
    if(isOpen){
      body=`<div class="wk-body open">`;
      groupExs(w.exs).forEach(ex=>{
        const pe=prev?prev.exs.find(e=>e.n===ex.n):null;
        const volEC=exVol(ex);const volEP=pe?exVol(pe):0;
        const rCls=pe?(volEC>volEP?'up':volEC<volEP?'dn':''):'';
        const wCls=(pe&&ex.w>0)?(ex.w>pe.w?'up':ex.w<pe.w?'dn':''):'';
        const arr={up:'↑',dn:'↓','':''};
        body+=`<div class="wk-ex">
          <div style="flex:1;min-width:0">
            <div class="wk-ex-name">${ex.n}</div>
            ${pe?`<div class="wk-ex-prev">Пред: ${fmtExPrev(pe)}</div>`:''}
          </div>
          <div class="wk-pills">
            <span class="wpill ${rCls}">${arr[rCls]||''}${fmtEx(ex)}${!ex.mixedW&&ex.w>0?' · '+ex.w+'кг':''}</span>
          </div>
        </div>`;
      });
      body+=`<button class="wk-edit-btn" onclick="event.stopPropagation();openEditWorkout('${w.id}')">✏️ Редактировать тренировку</button>`;
      body+=`</div>`;
    }

    return `<div class="wk-card">
      <div class="wk-hdr" onclick="toggleWkCard('${w.id}')">
        <span class="wk-date">${dateStr}</span>
        <span style="width:26px;height:26px;display:flex;align-items:center;justify-content:center;background:var(--bg3);border-radius:7px;flex-shrink:0">${svgIcon(svgId,15)}</span>
        <span class="wk-type">${typeName}</span>
        <span class="wk-cnt">${groupExs(w.exs).length} упр.</span>
        ${dyn}
        <span class="wk-chevron${isOpen?' open':''}">∨</span>
      </div>
      ${body}
    </div>`;
  }

  const wkCount=thisWeek.length;
  const mnStart=new Date();mnStart.setDate(1);
  const mnCount=A.workouts.filter(w=>w.date>=mnStart.toISOString().slice(0,10)).length;

  let html=`<div class="ph">
    <div class="ph-row" style="margin-bottom:4px;gap:8px">
      <div class="ph-h1">Спорт</div>
      <button onclick="openManageWorkoutTypes()" style="height:34px;padding:0 12px;border-radius:10px;background:var(--bg3);color:var(--t2);font-size:12px;font-weight:700;border:1.5px solid var(--bd2);cursor:pointer;font-family:inherit;flex-shrink:0">⚙️ Типы</button>
    </div>
  </div><div class="pg">`;

  html+=`<div class="rc" style="margin-bottom:12px"><div class="rc-t">Активность</div><div class="rs-row">
    <div class="rs"><div class="rs-n" style="color:var(--blu)">${wkCount}</div><div class="rs-l">Эта неделя</div></div>
    <div class="rs"><div class="rs-n" style="color:var(--pur)">${mnCount}</div><div class="rs-l">Месяц</div></div>
    <div class="rs"><div class="rs-n" style="color:var(--yel)">${A.workouts.length}</div><div class="rs-l">Всего</div></div>
  </div></div>`;

  if(thisWeek.length){
    html+=glHdr('Эта неделя',thisWeek.length,'var(--grn)');
    thisWeek.forEach(w=>{html+=buildCard(w,true);});
  }
  if(earlier.length){
    html+=glHdr('Ранее',earlier.length);
    earlier.forEach(w=>{html+=buildCard(w,false);});
  }
  if(!sorted.length){
    html+=`<div class="empty"><span style="display:flex;align-items:center;justify-content:center">{svgIcon("workout",40)}</span><div class="empty-t">Нет тренировок</div><div class="empty-s">Нажми ＋ чтобы добавить первую</div></div>`;
  }
  html+=`</div>`;
  return html;
}

function toggleWkCard(id){
  if(!A._expandedWk) A._expandedWk=new Set();
  if(A._expandedWk.has(id)) A._expandedWk.delete(id);
  else A._expandedWk.add(id);
  render();
}

function pgReport(){
  const wkD=new Date();wkD.setDate(wkD.getDate()-wkD.getDay()+1);const wk=wkD.toISOString().slice(0,10);
  const mnD=new Date();mnD.setDate(1);const mn=mnD.toISOString().slice(0,10);
  const tasks=A.tasks,done=tasks.filter(x=>x.s==='done'),active=tasks.filter(x=>x.s!=='done');
  const wkDone=done.filter(x=>x.doneAt&&x.doneAt>=wk).length;
  const wkAdded=tasks.filter(x=>x.dd&&x.dd>=wk).length;
  const mnDone=done.filter(x=>x.doneAt&&x.doneAt>=mn).length;
  const mnAdded=tasks.filter(x=>x.dd&&x.dd>=mn).length;
  const pct=(a,b)=>b>0?Math.round(a/b*100):0;

  let html=`<div class="ph">
    <div class="ph-row" style="margin-bottom:4px">
      <div class="ph-h1">📊 Статистика</div>
    </div>
  </div><div class="pg">`;

  html+=`<div class="rc"><div class="rc-t">Задачи — эта неделя</div><div class="rs-row">
    <div class="rs"><div class="rs-n" style="color:var(--grn)">${wkDone}</div><div class="rs-l">Выполнено</div></div>
    <div class="rs"><div class="rs-n" style="color:var(--blu)">${wkAdded}</div><div class="rs-l">Добавлено</div></div>
    <div class="rs"><div class="rs-n" style="color:var(--t2)">${pct(wkDone,wkAdded)}%</div><div class="rs-l">Закрыто</div></div>
  </div></div>`;

  html+=`<div class="rc"><div class="rc-t">Задачи — этот месяц</div><div class="rs-row">
    <div class="rs"><div class="rs-n" style="color:var(--grn)">${mnDone}</div><div class="rs-l">Выполнено</div></div>
    <div class="rs"><div class="rs-n" style="color:var(--blu)">${mnAdded}</div><div class="rs-l">Добавлено</div></div>
    <div class="rs"><div class="rs-n" style="color:var(--t2)">${pct(mnDone,mnAdded)}%</div><div class="rs-l">Закрыто</div></div>
  </div></div>`;

  // ── Collapsible done tasks
  const doneOpen=A._doneOpen||false;
  html+=`<div style="display:flex;align-items:center;justify-content:space-between;padding:14px 0 7px">
    <span style="font-size:10px;font-weight:800;color:var(--t3);letter-spacing:.09em;text-transform:uppercase">✅ Выполнено (${done.length})</span>
    <div style="display:flex;gap:8px">
      ${done.length?`<button onclick="clearDone()" style="font-size:11px;font-weight:700;color:var(--red);padding:4px 8px;background:var(--rbg);border-radius:6px;border:none;cursor:pointer">Очистить</button>`:''}
      <button onclick="A._doneOpen=!A._doneOpen;render()" style="font-size:11px;font-weight:700;color:var(--blu);padding:4px 10px;background:var(--bbg);border-radius:6px;border:none;cursor:pointer">${doneOpen?'Свернуть ∧':'Показать ∨'}</button>
    </div>
  </div>`;

  if(doneOpen){
    const doneList=[...done].sort((a,b)=>(b.doneAt||'').localeCompare(a.doneAt||'')).slice(0,50);
    const groups={};
    doneList.forEach(t=>{const k=t.doneAt||t.dd||'';if(!groups[k])groups[k]=[];groups[k].push(t);});
    if(!done.length){html+=`<div class="empty" style="padding:20px"><div class="empty-ic" style="font-size:28px">✅</div><div class="empty-t">Пока ничего</div></div>`;}
    else{
      Object.entries(groups).sort((a,b)=>b[0].localeCompare(a[0])).forEach(([date,ts])=>{
        html+=glHdr(fmtD(date)||'Без даты',ts.length);
        ts.forEach(t=>{
          const cat=getCat(t.cat);
          html+=`<div class="done-card" onclick="openEdit(${t.id})">
            <div class="done-chk">✓</div>
            <div class="done-body">
              <div class="done-title">${t.title}</div>
              <div class="done-meta">
                <span style="background:${cat.bg};color:${cat.c};padding:1px 6px;border-radius:4px;font-weight:700">${cat.l}</span>
                ${t.doneAt?`<span>✓ ${fmtDFull(t.doneAt)}</span>`:''}
              </div>
            </div>
          </div>`;
        });
      });
    }
  }

  // ── Workout stats
  const wkWs=A.workouts.filter(w=>w.date>=wk);
  const mnWs=A.workouts.filter(w=>w.date>=mn);
  html+=glHdr('Тренировки',A.workouts.length);
  html+=`<div class="rc"><div class="rs-row">
    <div class="rs"><div class="rs-n" style="color:var(--blu)">${wkWs.length}</div><div class="rs-l">Эта неделя</div></div>
    <div class="rs"><div class="rs-n" style="color:var(--pur)">${mnWs.length}</div><div class="rs-l">Месяц</div></div>
    <div class="rs"><div class="rs-n" style="color:var(--yel)">${A.workouts.length}</div><div class="rs-l">Всего</div></div>
  </div></div>`;

  // ── Графики по типам тренировок (отдельно для каждого)
  const byTypeChart={};
  A.workouts.forEach(w=>{if(!byTypeChart[w.type])byTypeChart[w.type]=[];byTypeChart[w.type].push(w);});
  const WTYPE_LABELS={chest:'Грудь / Трицепс',back:'Спина / Бицепс',legs:'Ноги',arms:'Руки',cardio:'Кардио',full:'Фулл-боди'};
  const WTYPE_COLORS={chest:'var(--blu)',back:'var(--pur)',legs:'var(--grn)',arms:'var(--yel)',cardio:'var(--red)',full:'var(--t2)'};

  function makeChart(ws, color, gradId){
    const sorted=[...ws].sort((a,b)=>a.date.localeCompare(b.date));
    if(sorted.length<2) return `<div style="text-align:center;padding:12px;color:var(--t3);font-size:12px">Нужно минимум 2 тренировки для графика</div>`;
    const vols=sorted.map(w=>({v:wVol(w),d:w.date}));
    const maxV=Math.max(...vols.map(x=>x.v));
    const minV=Math.min(...vols.map(x=>x.v));
    const W=320,H=80,padX=14,padY=10;
    const range=Math.max(maxV-minV,1);
    const pts=vols.map((x,i)=>{
      const cx=padX+(i/(vols.length-1))*(W-padX*2);
      const cy=padY+(1-(x.v-minV)/range)*(H-padY*2-12);
      return[cx,cy,x];
    });
    const path='M'+pts.map(p=>`${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' L');
    const area=`M${pts[0][0].toFixed(1)},${H-14} `+pts.map(p=>`L${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ')+` L${pts[pts.length-1][0].toFixed(1)},${H-14} Z`;
    return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;display:block" xmlns="http://www.w3.org/2000/svg">
      <defs><linearGradient id="${gradId}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="${color}" stop-opacity=".3"/>
        <stop offset="100%" stop-color="${color}" stop-opacity="0"/>
      </linearGradient></defs>
      <path d="${area}" fill="url(#${gradId})"/>
      <path d="${path}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      ${pts.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3.5" fill="${color}"/>`).join('')}
      ${pts.map((p,i)=>{
        const d=new Date(p[2].d+'T00:00:00');
        const lbl=d.getDate()+'.'+pad(d.getMonth()+1);
        return `<text x="${p[0].toFixed(1)}" y="${H-2}" text-anchor="middle" font-size="8" fill="var(--t3)" font-family="Inter">${lbl}</text>`;
      }).join('')}
      ${pts.map(p=>`<text x="${p[0].toFixed(1)}" y="${(p[1]-5).toFixed(1)}" text-anchor="middle" font-size="8" fill="${color}" font-family="Inter" font-weight="700">${p[2].v}</text>`).join('')}
    </svg>`;
  }

  if(Object.keys(byTypeChart).length){
    html+=glHdr('Прогресс по тренировкам',Object.keys(byTypeChart).length);
    Object.entries(byTypeChart).forEach(([type,ws],idx)=>{
      if(ws.length<2) return;
      const lbl=WTYPE_LABELS[type]||type;
      const color=WTYPE_COLORS[type]||'var(--blu)';
      const sorted2=[...ws].sort((a,b)=>a.date.localeCompare(b.date));
      const lastW=sorted2[sorted2.length-1];
      const prevW=sorted2[sorted2.length-2]||sorted2[0];
      const lastVol=wVol(lastW), prevVol=wVol(prevW);
      const totalDiff=lastVol-prevVol;
      const totalPct=prevVol>0?Math.round(totalDiff/prevVol*100):0;
      const arrow=totalDiff>0?'↑':totalDiff<0?'↓':'→';
      const arrowColor=totalDiff>0?'var(--grn)':totalDiff<0?'var(--red)':'var(--t3)';
      const lastDate=new Date(lastW.date+'T00:00:00');
      const prevDate=new Date(prevW.date+'T00:00:00');
      const lastLbl=lastDate.getDate()+'.'+pad(lastDate.getMonth()+1);
      const prevLbl=prevDate.getDate()+'.'+pad(prevDate.getMonth()+1);
      html+=`<div class="rc" style="margin-bottom:10px">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
          <span style="font-size:13px;font-weight:700">${lbl}</span>
          <span style="font-size:13px;font-weight:900;color:${arrowColor}">${arrow} ${Math.abs(totalPct)}% · ${prevLbl}→${lastLbl}</span>
        </div>
        ${makeChart(ws, color, 'lg'+idx)}
      </div>`;
    });
  }


  // ── Dynamics by type — collapsible with details
  const byType=byTypeChart;
  if(Object.keys(byType).length){
    html+=glHdr('Динамика нагрузки',Object.keys(byType).length);
    html+=`<div class="rc">`;
    Object.entries(byType).forEach(([type,ws])=>{
      const sorted=[...ws].sort((a,b)=>a.date.localeCompare(b.date));
      const last=sorted[sorted.length-1],prev=sorted[sorted.length-2];
      const lbl=WTYPE_LABELS[type]||type;
      if(!prev){
        html+=`<div class="ri"><span style="font-size:13px;font-weight:600">${lbl}</span><span style="font-size:11px;color:var(--t3)">1 тренировка</span></div>`;
        return;
      }
      const volL=wVol(last);
      const volP=wVol(prev);
      const diffPct=volP>0?Math.round((volL-volP)/volP*100):0;
      const col=diffPct>0?'var(--grn)':diffPct<0?'var(--red)':'var(--t3)';
      const arrow=diffPct>0?'↑':diffPct<0?'↓':'→';
      const isExp=A._expTypes?.has(type)||false;

      // Details: what changed
      const details=[];
      last.exs.forEach(ex=>{
        const pe=prev.exs.find(e=>e.n===ex.n);
        if(!pe){details.push(`➕ ${ex.n} — новое упражнение`);return;}
        if(ex.w>pe.w) details.push(`↑ ${ex.n}: вес ${pe.w}→${ex.w} кг`);
        else if(ex.s*ex.r>pe.s*pe.r) details.push(`🔁 ${ex.n}: объём ↑ (${pe.s}×${pe.r}→${ex.s}×${ex.r})`);
        else if(ex.s>pe.s) details.push(`📈 ${ex.n}: подходы ${pe.s}→${ex.s}`);
      });

      html+=`<div style="border-bottom:1px solid var(--bd)">
        <div class="ri" onclick="toggleTypeExp('${type}')">
          <span style="font-size:13px;font-weight:700">${lbl}</span>
          <div style="display:flex;align-items:center;gap:8px">
            <span style="font-size:11px;color:var(--t3)">${fmtD(last.date)}</span>
            <span style="font-size:15px;font-weight:900;color:${col}">${arrow} ${Math.abs(diffPct)}%</span>
            <span style="font-size:12px;color:var(--t3)">${isExp?'∧':'∨'}</span>
          </div>
        </div>
        ${isExp&&details.length?`<div style="padding:6px 0 10px;display:flex;flex-direction:column;gap:5px">
          ${details.map(d=>`<span style="font-size:12px;color:var(--t2)">${d}</span>`).join('')}
        </div>`:''}
      </div>`;
    });
    html+=`</div>`;
  }

  // ── Muscle groups load
  const muscleCount={};
  A.workouts.forEach(w=>{muscleCount[w.type]=(muscleCount[w.type]||0)+1;});
  const total=A.workouts.length||1;
  const muscleIc={chest:'chest',back:'back',legs:'legs',arms:'arms',cardio:'cardio',full:'full'};
  if(Object.keys(muscleCount).length){
    html+=glHdr('Нагрузка по группам мышц',Object.keys(muscleCount).length);
    html+=`<div class="rc">`;
    Object.entries(muscleCount).sort((a,b)=>b[1]-a[1]).forEach(([type,count])=>{
      const p=Math.round(count/total*100);
      const lbl=WTYPE_LABELS[type]||type;
      const ic=muscleIc[type]||'full';
      html+=`<div style="margin-bottom:10px">
        <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px;align-items:center">
          <span style="display:flex;align-items:center;gap:6px;font-weight:700">${svgIcon(ic,14)}<span>${lbl}</span></span>
          <span style="color:var(--t3)">${count} тренировок · ${p}%</span>
        </div>
        <div class="rbar"><div class="rbar-f" style="width:${p}%;background:var(--blu)"></div></div>
      </div>`;
    });
    html+=`</div>`;
  }

  html+=`</div>`;
  return html;
}
function toggleTypeExp(type){
  if(!A._expTypes) A._expTypes=new Set();
  if(A._expTypes.has(type))A._expTypes.delete(type);else A._expTypes.add(type);
  render();
}

function resetWorkouts(){
  if(!confirm('Заменить тренировки на полную историю из заметок?\nТвои задачи и настройки останутся нетронутыми.')) return;
  A.workouts = seedWorkouts();
  saveState();
  render();
  toast('✅ История тренировок загружена — 12 тренировок');
}
function openNew(){
  A.edit={cat:A.filterCat!=='all'?A.filterCat:'tasks',p:'yellow',s:'todo',dl:A.selDate!==today()?A.selDate:'',note:''};
  showTaskSheet(false);
}
function openEdit(id){
  A.edit={...A.tasks.find(t=>t.id===id)};
  if(!A.edit.title){toast('Задача не найдена');return;}
  showTaskSheet(!!A.edit.id);
}

function showTaskSheet(isEdit){
  const e=A.edit||{};
  // Сохраняем текст если форма уже открыта
  const et=$('fT')?.value, en=$('fN')?.value;
  if(et!==undefined) e.title=et;
  if(en!==undefined) e.note=en;

  const p=e.p||'yellow', st=e.s||'todo', cat=e.cat||'tasks', dl=e.dl||'';
  const remVal=A.reminders[e.id]?new Date(A.reminders[e.id]).toISOString().slice(0,16):'';

  let pHtml='<div style="display:flex;gap:8px">';
  PRIOS.forEach(pr=>{
    pHtml+=`<div class="pbtn${p===pr.id?' on':''}" data-p="${pr.id}" onclick="eSel('p','${pr.id}')" style="background:${pr.bg}"><div class="psq" style="background:${pr.c}"></div></div>`;
  });
  pHtml+='</div>';

  let sHtml='<div class="pr2">';
  STATS.forEach(s=>{sHtml+=`<div class="pch${st===s.id?' on':''}" data-s="${s.id}" onclick="eSel('s','${s.id}')">${s.l}</div>`;});
  sHtml+='</div>';

  let cHtml='<div class="pr2" style="max-height:120px;overflow-y:auto">';
  // Для идей показываем только категорию ideas, для остальных — без auto и ideas
  const catList = cat==='ideas'
    ? A.cats.filter(c=>c.id==='ideas')
    : A.cats.filter(c=>c.id!=='auto'&&c.id!=='ideas');
  catList.forEach(c=>{
    const on=cat===c.id, pfx=c.parent?'↳ ':'';
    cHtml+=`<div class="pch${on?' on':''}" data-cat="${c.id}" onclick="eSel('cat','${c.id}')" style="${on?'border-color:'+c.c+';color:'+c.c+';background:'+c.bg:''}"><span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:${c.c};margin-right:4px;vertical-align:middle"></span>${pfx}${c.l}</div>`;
  });
  cHtml+='</div>';

  const dlOpts=[{l:'Сегодня',v:today()},{l:'Завтра',v:tomorrow()},{l:'+3',v:addDays(3)},{l:'+7',v:addDays(7)}];
  let qdHtml='<div class="qdl">';
  dlOpts.forEach(o=>{qdHtml+=`<div class="qdlb${dl===o.v?' on':''}" data-dl="${o.v}" onclick="setDl('${o.v}')">${o.l}</div>`;});
  qdHtml+=`<div class="qdlb${!dl?' on':''}" data-dl="" onclick="clearDl()">× Нет</div>`;
  qdHtml+='</div>';

  const resumeBtn=isEdit&&e.s==='done'?`<button class="btn-warn" onclick="resumeTask(${e.id})">↩ Возобновить</button>`:'';

  openSheet(`
    <div class="sht-hdr">
      <span class="sht-ttl">${isEdit?'Редактировать':'Новая задача'}</span>
      <div class="sht-x" onclick="closeSheet()">✕</div>
    </div>
    <div class="ss"><div class="sl">Название</div>
      <textarea class="si" id="fT" rows="2" placeholder="Что нужно сделать?">${e.title||''}</textarea>
    </div>
    <div class="ss"><div class="sl">Приоритет</div>${pHtml}</div>
    <div class="ss"><div class="sl">Статус</div>${sHtml}</div>
    <div class="ss"><div class="sl">Категория</div>${cHtml}</div>
    <div class="ss"><div class="sl">Дедлайн</div>
      ${qdHtml}
      <div style="display:flex;align-items:center;gap:8px;margin-top:6px">
        <input type="date" class="si" id="fDl" value="${dl}" onchange="syncDlInput(this.value)" style="flex:1">
        ${dl?`<button onclick="clearDl()" style="height:40px;padding:0 12px;border-radius:9px;background:var(--rbg);color:var(--red);border:none;cursor:pointer;font-family:inherit;font-size:12px;font-weight:700;flex-shrink:0">Сброс</button>`:''}
      </div>
    </div>
    <div class="ss"><div class="sl">Напоминание</div>
      <input type="datetime-local" class="si" id="fRem" value="${remVal}">
    </div>
    <div class="ss"><div class="sl">Заметка</div>
      <textarea class="si" id="fN" rows="2" placeholder="Дополнительно...">${e.note||''}</textarea>
    </div>
    <button class="btn-s" onclick="saveTask()">${isEdit?'Сохранить изменения':'Добавить задачу'}</button>
    ${resumeBtn}
    ${isEdit?`<button class="btn-d" onclick="delTask(${e.id})">🗑 Удалить задачу</button>`:''}
  `);
}

function eSel(f,v){
  if(!A.edit) return;
  A.edit[f]=v;
  if(f==='p'){
    document.querySelectorAll('[data-p]').forEach(el=>el.classList.toggle('on',el.dataset.p===v));
  } else if(f==='s'){
    document.querySelectorAll('[data-s]').forEach(el=>el.classList.toggle('on',el.dataset.s===v));
  } else if(f==='cat'){
    document.querySelectorAll('[data-cat]').forEach(el=>{
      const c=A.cats.find(x=>x.id===v);
      const on=el.dataset.cat===v;
      el.classList.toggle('on',on);
      if(on&&c){el.style.borderColor=c.c;el.style.color=c.c;el.style.background=c.bg;}
      else{el.style.borderColor='';el.style.color='';el.style.background='';}
    });
  }
}

function setDl(v){
  if(!A.edit) return;
  const newDl=A.edit.dl===v?'':v;
  A.edit.dl=newDl;
  document.querySelectorAll('[data-dl]').forEach(el=>{
    el.classList.toggle('on', el.dataset.dl===newDl&&(newDl!==''||el.dataset.dl===''));
    if(el.dataset.dl==='') el.classList.toggle('on',!newDl);
  });
  const inp=$('fDl'); if(inp) inp.value=newDl;
}

function clearDl(){
  if(!A.edit) return;
  A.edit.dl='';
  document.querySelectorAll('[data-dl]').forEach(el=>el.classList.toggle('on',el.dataset.dl===''));
  const inp=$('fDl'); if(inp) inp.value='';
  showTaskSheet(!!A.edit.id);
}

function syncDlInput(v){
  if(!A.edit) return;
  A.edit.dl=v||'';
  document.querySelectorAll('[data-dl]').forEach(el=>el.classList.toggle('on',v?el.dataset.dl===v:el.dataset.dl===''));
}

function saveTask(){
  const title=($('fT')?.value||'').trim();
  if(!title){toast('Введи название задачи');return;}
  const dl=$('fDl')?.value||A.edit.dl||'';
  const note=($('fN')?.value||'').trim();
  const rem=$('fRem')?.value||'';
  const task={
    ...A.edit,
    title, dl, note,
    dd: A.edit.dd||today(),
    s: A.edit.s||'todo',
    p: A.edit.p||'yellow',
    cat: A.edit.cat||'tasks',
  };
  if(task.id){
    const i=A.tasks.findIndex(t=>t.id===task.id);
    if(i!==-1) A.tasks[i]=task;
  } else {
    task.id=Date.now();
    A.tasks.unshift(task); // в начало списка
  }
  if(rem){
    const ts=new Date(rem).getTime();
    if(ts>Date.now()){A.reminders[task.id]=ts;schedRem(task.id,task.title,ts);}
  } else {
    delete A.reminders[task.id];
  }
  saveState();closeSheet();render();
  toast(A.edit.id?'Задача обновлена ✓':'Задача добавлена ✓');
}

function delTask(id){
  if(!confirm('Удалить задачу?'))return;
  A.tasks=A.tasks.filter(t=>t.id!==id);
  delete A.reminders[id];
  saveState();closeSheet();render();toast('Задача удалена');
}

function toggleDone(e,id){
  e.stopPropagation();
  const t=A.tasks.find(t=>t.id===id);if(!t)return;
  t.s=t.s==='done'?'todo':'done';
  if(t.s==='done')t.doneAt=today();
  saveState();render();
}

function resumeTask(id){
  const t=A.tasks.find(t=>t.id===id);if(!t)return;
  t.s='todo';delete t.doneAt;
  saveState();closeSheet();render();toast('Задача возобновлена');
}

function clearDone(){
  if(!confirm('Удалить все выполненные?'))return;
  A.tasks=A.tasks.filter(t=>t.s!=='done');
  saveState();render();toast('Выполненные удалены');
}

function openNewWorkout(){

function openWorkoutForm(type,wid){
  const existing=wid?A.workouts.find(w=>w.id===wid):null;
  const last=existing||A.workouts.filter(w=>w.type===type).sort((a,b)=>b.date.localeCompare(a.date))[0];
  const prev=wid?A.workouts.filter(w=>w.type===type&&w.id!==wid).sort((a,b)=>b.date.localeCompare(a.date))[0]:
    A.workouts.filter(w=>w.type===type).sort((a,b)=>b.date.localeCompare(a.date))[1];
  const initExs=last?last.exs:[{n:'',s:3,r:10,w:0}];
  let exHtml='';
  initExs.forEach((ex,i)=>{
    const pe=prev?prev.exs.find(e=>e.n===ex.n):null;
    exHtml+=`<div style="background:var(--bg3);border-radius:10px;padding:10px;margin-bottom:8px">
      <input class="si" style="margin-bottom:7px" placeholder="Упражнение" id="en${i}" value="${ex.n}">
      ${pe?`<div style="font-size:10px;color:var(--t3);margin-bottom:5px">пред: ${pe.s}×${pe.r}${pe.w>0?' '+pe.w+'кг':''}</div>`:''}
      <div style="display:flex;gap:6px">
        <div style="flex:1"><div style="font-size:9px;color:var(--t3);font-weight:800;text-transform:uppercase;margin-bottom:3px">Подходы</div>
          <input class="si" type="number" id="es${i}" value="${ex.s}"></div>
        <div style="flex:1"><div style="font-size:9px;color:var(--t3);font-weight:800;text-transform:uppercase;margin-bottom:3px">Повторения</div>
          <input class="si" type="number" id="er${i}" value="${ex.r}"></div>
        <div style="flex:1"><div style="font-size:9px;color:var(--t3);font-weight:800;text-transform:uppercase;margin-bottom:3px">Кг</div>
          <input class="si" type="number" id="ew${i}" value="${ex.w}"></div>
      </div>
    </div>`;
  });
  const prevLabel=prev?` (пред. ${fmtD(prev.date)})`:' (первая тренировка этого типа)';
  openSheet(`
    <div class="sht-hdr">
      <span class="sht-ttl">${wid?'Редактировать тренировку':'Новая тренировка'}</span>
      <div class="sht-x" onclick="closeSheet()">✕</div>
    </div>
    <div class="ss"><div class="sl">Дата</div>
      <input type="date" class="si" id="wDate" value="${existing?existing.date:today()}">
    </div>
    <div class="ss">
      <div class="sl">Упражнения${prevLabel}</div>
      <div id="exList">${exHtml}</div>
      <input type="hidden" id="wType" value="${type}">
      <input type="hidden" id="wId" value="${wid||''}">
      <input type="hidden" id="wCnt" value="${initExs.length}">
      <button onclick="addEx()" style="width:100%;height:38px;border-radius:9px;background:var(--bg3);color:var(--t2);font-size:12px;font-weight:700;margin-top:2px;border:none;cursor:pointer;font-family:inherit">＋ Добавить упражнение</button>
    </div>
    <button class="btn-s" onclick="saveWorkout()">${wid?'Сохранить изменения':'Сохранить тренировку'}</button>
    ${wid?`<button class="btn-d" onclick="delWorkout('${wid}')">🗑 Удалить тренировку</button>`:''}
  `);
}

function openEditWorkout(id){
  const w=A.workouts.find(w=>w.id===id);
  if(!w)return;
  openWorkoutForm(w.type,id);
}

function addEx(){
  const list=$('exList'),cnt=$('wCnt');if(!list||!cnt)return;
  const i=parseInt(cnt.value);
  list.insertAdjacentHTML('beforeend',`<div style="background:var(--bg3);border-radius:10px;padding:10px;margin-bottom:8px">
    <input class="si" style="margin-bottom:7px" placeholder="Упражнение" id="en${i}">
    <div style="display:flex;gap:6px">
      <div style="flex:1"><div style="font-size:9px;color:var(--t3);font-weight:800;text-transform:uppercase;margin-bottom:3px">Подходы</div><input class="si" type="number" id="es${i}" value="3"></div>
      <div style="flex:1"><div style="font-size:9px;color:var(--t3);font-weight:800;text-transform:uppercase;margin-bottom:3px">Повторения</div><input class="si" type="number" id="er${i}" value="10"></div>
      <div style="flex:1"><div style="font-size:9px;color:var(--t3);font-weight:800;text-transform:uppercase;margin-bottom:3px">Кг</div><input class="si" type="number" id="ew${i}" value="0"></div>
    </div>
  </div>`);
  cnt.value=i+1;
}

function saveWorkout(){
  const date=$('wDate')?.value||today();
  const type=$('wType')?.value||'chest';
  const wid=$('wId')?.value||'';
  const cnt=parseInt($('wCnt')?.value||'0');
  const exs=[];
  for(let i=0;i<cnt;i++){
    const n=($('en'+i)?.value||'').trim();if(!n)continue;
    exs.push({n,s:parseInt($('es'+i)?.value||3),r:parseInt($('er'+i)?.value||10),w:parseFloat($('ew'+i)?.value||0)});
  }
  if(!exs.length){toast('Добавь хотя бы одно упражнение');return;}
  if(wid){
    const i=A.workouts.findIndex(w=>w.id===wid);
    if(i!==-1)A.workouts[i]={...A.workouts[i],date,exs};
  } else {
    A.workouts.push({id:'w'+Date.now(),date,type,exs});
  }
  saveState();closeSheet();render();toast(wid?'Тренировка обновлена':'Тренировка сохранена');
}

function delWorkout(id){
  if(!confirm('Удалить тренировку?'))return;
  A.workouts=A.workouts.filter(w=>w.id!==id);
  saveState();closeSheet();render();toast('Тренировка удалена');
}

function addCat(){

  saveState();render();toast('Категория удалена');
}

// ═══════════════════════════════════════════════════════════
// PAGE: MEMOS (Заметки)
// ═══════════════════════════════════════════════════════════
function pgMemos(){
  if(!A.memos) A.memos=[];
  const memos=A.memos;
  const activeIdeas=A.tasks.filter(t=>t.cat==='ideas'&&t.s!=='done');
  const doneIdeas=A.tasks.filter(t=>t.cat==='ideas'&&t.s==='done');

  let html=`<div class="ph">
    <div class="ph-row" style="margin-bottom:4px">
      <div class="ph-h1">Заметки</div>
    </div>
  </div><div class="pg">`;

  // Поле быстрой заметки
  html+=`<div style="background:var(--bg2);border-radius:var(--r);border:1.5px solid var(--bd);margin-bottom:12px;overflow:hidden">
    <textarea id="memoInput" rows="3" placeholder="Напиши заметку..." style="width:100%;background:transparent;border:none;outline:none;padding:14px;font-size:14px;font-weight:500;color:var(--tx);font-family:inherit;resize:none;line-height:1.5"></textarea>
    <div style="display:flex;gap:8px;padding:0 12px 12px">
      <button onclick="saveMemo()" style="height:34px;padding:0 16px;border-radius:10px;background:var(--blu);color:#fff;font-size:13px;font-weight:700;border:none;cursor:pointer;font-family:inherit">Сохранить</button>
    </div>
  </div>`;

  if(!memos.length && !activeIdeas.length){
    html+=`<div class="empty"><div class="empty-ic" style="font-size:36px">📝</div><div class="empty-t">Пока пусто</div><div class="empty-s">Напиши заметку или добавь идею</div></div>`;
  }

  // Текстовые заметки
  if(memos.length){
    html+=glHdr('Заметки',memos.length);
    memos.forEach((m,idx)=>{
      html+=`<div style="background:var(--bg2);border-radius:var(--r);padding:13px;margin-bottom:8px;border:1.5px solid var(--bd);cursor:pointer" onclick="editMemo(${idx})">
        <div style="font-size:13px;font-weight:500;color:var(--tx);line-height:1.5;white-space:pre-wrap">${m.text}</div>
        <div style="font-size:10px;color:var(--t3);margin-top:6px">${fmtDFull(m.date)}</div>
      </div>`;
    });
  }

  // Идеи и размышления
  html+=`<div style="display:flex;align-items:center;justify-content:space-between;padding:14px 0 7px">
    <span style="font-size:10px;font-weight:800;color:var(--grn);letter-spacing:.09em;text-transform:uppercase">💡 Размышления (${activeIdeas.length})</span>
  </div>`;
  if(!activeIdeas.length){
    html+=`<div style="text-align:center;padding:12px;color:var(--t3);font-size:13px">Нет идей — нажми ＋ чтобы добавить</div>`;
  } else {
    activeIdeas.forEach(t=>{html+=card(t);});
  }
  if(doneIdeas.length){
    html+=glHdr('Реализовано',doneIdeas.length,'var(--t3)');
    doneIdeas.forEach(t=>{html+=card(t);});
  }

  html+=`</div>`;
  return html;
}

function saveMemo(){
  const inp=$('memoInput');
  const text=(inp?.value||'').trim();
  if(!text){toast('Введи текст');return;}
  if(!A.memos) A.memos=[];
  A.memos.unshift({id:Date.now(),text,date:today()});
  saveState();render();toast('Заметка сохранена');
}

function editMemo(idx){
  if(!A.memos||idx<0||idx>=A.memos.length) return;
  const m=A.memos[idx];
  openSheet(`<div class="sht-hdr"><span class="sht-ttl">Заметка</span><div class="sht-x" onclick="closeSheet()">✕</div></div>
    <div class="ss">
      <textarea class="si" id="memoEditText" rows="6" style="font-size:14px;line-height:1.6">${m.text}</textarea>
    </div>
    <button class="btn-s" onclick="updateMemo(${idx})">Сохранить</button>
    <button class="btn-d" onclick="deleteMemo(${idx})">🗑 Удалить заметку</button>`);

// NOTION SYNC
// ═══════════════════════════════════════════════════════════
const NOTION_API='https://api.anthropic.com/v1/messages';

async function notionReq(method,path,body){
  const {key}=A.notion;
  const r=await fetch('https://api.notion.com/v1'+path,{
    method,
    headers:{'Authorization':'Bearer '+key,'Content-Type':'application/json','Notion-Version':'2022-06-28'},
    body:body?JSON.stringify(body):undefined
  });
  if(!r.ok){const e=await r.json();throw new Error(e.message||r.status);}
  return r.json();
}

// Map our priority → Notion select
const PRIO_TO_NOTION={red:'🔴 Высокий',yellow:'🟡 Средний',green:'🟢 Низкий',blue:'🔵 Инфо'};
const NOTION_TO_PRIO={'🔴 Высокий':'red','🟡 Средний':'yellow','🟢 Низкий':'green','🔵 Инфо':'blue'};
const STAT_TO_NOTION={todo:'📋 К выполнению',doing:'⏳ В процессе',wait:'📨 Ожидаю ответа',done:'✅ Выполнено',over:'⚠️ Просрочено'};
const NOTION_TO_STAT={'📋 К выполнению':'todo','⏳ В процессе':'doing','📨 Ожидаю ответа':'wait','✅ Выполнено':'done','⚠️ Просрочено':'over'};

function taskToNotionProps(t){
  const cat=getCat(t.cat);
  const props={
    'Задача':{title:[{text:{content:t.title}}]},
    'Статус':{select:{name:STAT_TO_NOTION[t.s]||'📋 К выполнению'}},
    'Приоритет':{select:{name:PRIO_TO_NOTION[t.p]||'🟡 Средний'}},
    'Категория':{select:{name:cat.l}},
  };
  if(t.dl) props['Дедлайн']={date:{start:t.dl}};
  if(t.note) props['Заметки']={rich_text:[{text:{content:t.note.slice(0,2000)}}]};
  return props;
}

function notionPageToTask(page){
  const pr=page.properties;
  const title=pr['Задача']?.title?.[0]?.text?.content||'';
  if(!title)return null;
  return{
    id:page.id.replace(/-/g,''),
    notionId:page.id,
    title,
    s:NOTION_TO_STAT[pr['Статус']?.select?.name]||'todo',
    p:NOTION_TO_PRIO[pr['Приоритет']?.select?.name]||'yellow',
    cat:A.cats.find(c=>c.l===pr['Категория']?.select?.name)?.id||'other',
    dl:pr['Дедлайн']?.date?.start||'',
    note:pr['Заметки']?.rich_text?.[0]?.text?.content||'',
    dd:today(),
    doneAt:pr['Статус']?.select?.name==='✅ Выполнено'?today():'',
  };
}

async function syncToNotion(){
  const{key,dbId}=A.notion;
  if(!key||!dbId){toast('Настрой Notion в ⚙️ Настройках');return;}
  A._syncing=true;render();
  try{
    const activeTasks=A.tasks.filter(t=>!t.notionId&&t.s!=='done').slice(0,50);
    let pushed=0;
    for(const t of activeTasks){
      const res=await notionReq('POST','/pages',{parent:{database_id:dbId},properties:taskToNotionProps(t)});
      t.notionId=res.id;
      pushed++;
    }
    // Update existing
    const updatedTasks=A.tasks.filter(t=>t.notionId);
    for(const t of updatedTasks){
      await notionReq('PATCH','/pages/'+t.notionId,{properties:taskToNotionProps(t)});
    }
    saveState();
    toast('Notion: отправлено '+pushed+' задач ✓');
  }catch(e){toast('Ошибка Notion: '+e.message);}
  A._syncing=false;render();
}

async function syncFromNotion(){
  const{key,dbId}=A.notion;
  if(!key||!dbId){toast('Настрой Notion в ⚙️ Настройках');return;}
  A._syncing=true;render();
  try{
    const res=await notionReq('POST','/databases/'+dbId+'/query',{page_size:100});
    let imported=0,updated=0;
    for(const page of res.results){
      const t=notionPageToTask(page);
      if(!t)continue;
      const existing=A.tasks.find(x=>x.notionId===page.id);
      if(existing){Object.assign(existing,t,{id:existing.id});updated++;}
      else{t.id=Date.now()+Math.random();A.tasks.push(t);imported++;}
    }
    saveState();
    toast('Notion: получено '+imported+' новых, обновлено '+updated+' ✓');
  }catch(e){toast('Ошибка Notion: '+e.message);}
  A._syncing=false;render();
}

async function fullSync(){
  await syncToNotion();
  await syncFromNotion();
}

async function fetchWeather(){
  try{
    const pos=await new Promise((res,rej)=>navigator.geolocation.getCurrentPosition(res,rej,{timeout:5000}));
    const {latitude:lat,longitude:lon}=pos.coords;
    const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`);
    const data=await r.json();
    const wc=data.current_weather.weathercode;
    const temp=Math.round(data.current_weather.temperature);
    const icons={0:'☀️',1:'🌤',2:'⛅',3:'☁️',45:'🌫',48:'🌫',51:'🌦',61:'🌧',71:'🌨',80:'🌦',95:'⛈',99:'⛈'};
    const icon=icons[wc]||icons[Math.floor(wc/10)*10]||'🌡';
    A.weather={temp,icon};render();
  }catch(e){toast('Не удалось получить погоду');}
}

function schedRem(id,title,ts){
  if(!('Notification' in window)) return;
  const delay=ts-Date.now();
  if(delay<=0) return;

  const doFire=()=>{
    try{
      new Notification('📋 Планировщик',{
        body:title,
        icon:'https://planner-go.netlify.app/icon.png',
        badge:'https://planner-go.netlify.app/icon.png',
        tag:'reminder-'+id,
        renotify:true,
        requireInteraction:false,
      });
    } catch(e){}
  };

  if(Notification.permission==='granted'){
    setTimeout(doFire, delay);
  } else if(Notification.permission!=='denied'){
    Notification.requestPermission().then(p=>{
      if(p==='granted') setTimeout(doFire, delay);
    });
  }
}

function exportBackup(){
  const data={
    tasks:A.tasks, workouts:A.workouts, reminders:A.reminders,
    cats:A.cats, notion:A.notion, theme:A.theme,
    autoTasks:A.autoTasks||[], autoService:A.autoService||[],
    workoutTypes:A.workoutTypes||[], memos:A.memos||[],
    exportDate: new Date().toISOString(),
    version:'pln6'
  };
  const json=JSON.stringify(data,null,2);
  const blob=new Blob([json],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  const d=new Date();
  a.href=url;
  a.download='planner-backup-'+d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'.json';
  a.click();
  URL.revokeObjectURL(url);
  toast('✅ Резервная копия сохранена');
}

function importBackup(){
  const inp=document.createElement('input');
  inp.type='file';inp.accept='.json';
  inp.onchange=async e=>{
    const file=e.target.files[0];if(!file)return;
    try{
      const text=await file.text();
      const data=JSON.parse(text);
      if(!data.tasks&&!data.workouts){toast('❌ Неверный формат файла');return;}
      if(!confirm('Восстановить данные из копии?\nТекущие данные будут заменены.'))return;
      A.tasks=data.tasks||A.tasks;
      A.workouts=data.workouts||A.workouts;
      A.reminders=data.reminders||{};
      A.cats=data.cats&&data.cats.length?data.cats:A.cats;
      A.notion=data.notion||A.notion;
      A.theme=data.theme||A.theme;
      A.autoTasks=data.autoTasks||A.autoTasks;
      A.autoService=data.autoService||A.autoService;
      A.workoutTypes=data.workoutTypes||A.workoutTypes;
      A.memos=data.memos||A.memos;
      saveState();applyTheme(A.theme);render();
      toast('✅ Данные восстановлены');
    }catch(err){toast('❌ Ошибка чтения файла');}
  };
  inp.click();
}

// PWA Service Worker — офлайн поддержка
if('serviceWorker' in navigator){
  const swLines=[
    "const CACHE='pln-v4';",
    "self.addEventListener('install',e=>{",
    "  e.waitUntil(self.skipWaiting());",
    "});",
    "self.addEventListener('activate',e=>{",
    "  e.waitUntil(caches.keys().then(ks=>Promise.all(ks.filter(k=>k!==CACHE).map(k=>caches.delete(k)))).then(()=>clients.claim()));",
    "});",
    "self.addEventListener('fetch',e=>{",
    "  if(e.request.method!=='GET')return;",
    "  e.respondWith(caches.open(CACHE).then(async c=>{",
    "    const cached=await c.match(e.request);",
    "    try{const r=await fetch(e.request);if(r.ok)c.put(e.request,r.clone());return r;}",
    "    catch{return cached||new Response('Офлайн',{status:503});}",
    "  }));",
    "});"
  ];
  const sw=swLines.join('\n');
  const blob=new Blob([sw],{type:'application/javascript'});
  navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(()=>{});
}
