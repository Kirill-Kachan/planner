<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Планировщик">
<meta name="theme-color" content="#0d0d10">
<link rel="manifest" href="data:application/json,{&quot;name&quot;:&quot;Планировщик&quot;,&quot;short_name&quot;:&quot;Планы&quot;,&quot;display&quot;:&quot;standalone&quot;,&quot;background_color&quot;:&quot;%230d0d10&quot;,&quot;theme_color&quot;:&quot;%230d0d10&quot;,&quot;start_url&quot;:&quot;.&quot;}">
<title>Планировщик</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d0d10;--bg2:#16161c;--bg3:#1e1e26;--bg4:#26262f;
  --bd:rgba(255,255,255,.06);--bd2:rgba(255,255,255,.12);
  --tx:#eeeef5;--t2:#8888a0;--t3:#50506a;
  --acc:#1a8fff;
  --red:#ff3b50;--yel:#ffaa00;--grn:#26d467;--blu:#1a8fff;--pur:#9b8dff;
  --rbg:rgba(255,59,80,.13);--ybg:rgba(255,170,0,.13);--gbg:rgba(38,212,103,.13);
  --bbg:rgba(26,143,255,.13);--pbg:rgba(155,141,255,.13);
  --r:13px;--rs:8px;
  --nav-h:64px;
}
[data-theme="light"]{
  --bg:#f5f5f7;--bg2:#ffffff;--bg3:#f0f0f5;--bg4:#e8e8f0;
  --bd:rgba(0,0,0,.07);--bd2:rgba(0,0,0,.12);
  --tx:#1a1a2e;--t2:#555570;--t3:#9090a8;
}
[data-theme="sepia"]{
  --bg:#1a1510;--bg2:#221e17;--bg3:#2a251c;--bg4:#322c22;
  --bd:rgba(255,220,150,.07);--bd2:rgba(255,220,150,.13);
  --tx:#f0e6cc;--t2:#a09070;--t3:#6a5a40;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg)}
body{font-family:'Inter',sans-serif;color:var(--tx);max-width:960px;margin:0 auto;display:flex;flex-direction:column;transition:background .2s,color .2s}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit;color:var(--tx);background:var(--bg3)}

#app{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-bottom:calc(var(--nav-h) + 12px)}
#app::-webkit-scrollbar{width:4px}
#app::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:2px}

/* ── BOTTOM NAV ─────────────────────────────── */
.nav{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);
  width:100%;max-width:960px;
  background:var(--bg2);border-top:1px solid var(--bd);
  display:flex;align-items:center;
  height:var(--nav-h);padding:0 8px 8px;
  z-index:100;
}
.nvi{
  flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:3px;padding:6px 4px;
  cursor:pointer;color:var(--t3);
  font-size:9px;font-weight:700;letter-spacing:.04em;
  text-transform:uppercase;transition:color .15s;border-radius:12px;
}
.nvi.on{color:var(--acc)}
.nvi-ic{font-size:22px;line-height:1}
.nvi-lbl{font-size:9px;font-weight:700}

/* ── PAGE HEADER ────────────────────────────── */
.ph{padding:52px 16px 0}
@media(min-width:600px){.ph{padding:24px 24px 0}}
.ph-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:2px}
.ph-label{font-size:11px;font-weight:700;color:var(--t3);letter-spacing:.1em;text-transform:uppercase}
.ph-acts{display:flex;gap:7px;align-items:center}
.ibtn{width:34px;height:34px;border-radius:50%;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;transition:background .15s;flex-shrink:0;border:none}
.ibtn:active{background:var(--bg4)}
.ph-h1{font-size:26px;font-weight:900;line-height:1.15;letter-spacing:-.5px}
.ph-sub{font-size:13px;color:var(--t2);margin-top:2px}

/* ── WEEK STRIP ─────────────────────────────── */
.ws-wrap{padding:14px 16px 0;user-select:none}
.ws-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.ws-nav{width:30px;height:30px;border-radius:50%;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;border:none;color:var(--tx)}
.ws-nav:active{background:var(--bg4)}
.ws-month{font-size:13px;font-weight:700;color:var(--t2)}
.ws-days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.dd{
  height:60px;border-radius:11px;background:var(--bg2);
  border:1.5px solid transparent;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:2px;
  cursor:pointer;transition:background .13s,border-color .13s;position:relative;
}
.dd.sel{background:var(--bbg);border-color:var(--blu)}
.dd.tod .dn{color:var(--yel)}
.dd::after{content:'';position:absolute;bottom:5px;width:4px;height:4px;border-radius:50%;opacity:0;transition:opacity .13s}
.dd.has::after{opacity:1;background:var(--t3)}
.dd.sel.has::after{background:var(--blu)}
.dd.ovd::after{opacity:1;background:var(--red)}
.dw{font-size:9px;font-weight:800;color:var(--t3);text-transform:uppercase;letter-spacing:.05em}
.dn{font-size:16px;font-weight:900;color:var(--tx)}
.dd.sel .dw,.dd.sel .dn{color:var(--blu)}

/* ── QUICK STATS ────────────────────────────── */
.qsbar{display:flex;gap:7px;padding:10px 16px 0}
.qs{flex:1;background:var(--bg2);border-radius:10px;padding:8px 6px;text-align:center;border:1.5px solid var(--bd)}
.qs-n{font-size:18px;font-weight:900}
.qs-l{font-size:9px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.04em;margin-top:1px}

/* ── CATEGORY FILTER ────────────────────────── */
.cf-wrap{padding:10px 0 0;overflow-x:auto;scrollbar-width:none}
.cf-wrap::-webkit-scrollbar{display:none}
.cf-inner{display:flex;gap:6px;padding:0 16px;min-width:max-content}
.cfc{height:30px;padding:0 12px;border-radius:20px;background:var(--bg2);
  font-size:12px;font-weight:700;color:var(--t3);white-space:nowrap;
  cursor:pointer;border:1.5px solid transparent;display:flex;align-items:center;
  gap:5px;transition:all .13s;flex-shrink:0}
.cfc.on{background:var(--bg3);border-color:var(--bd2);color:var(--tx)}
.cdot{width:7px;height:7px;border-radius:50%;flex-shrink:0}

/* ── CONTENT ─────────────────────────────────── */
.pg{padding:10px 16px 0}
@media(min-width:600px){.pg{padding:10px 24px 0}}
.gl{font-size:10px;font-weight:800;color:var(--t3);letter-spacing:.09em;text-transform:uppercase;
  padding:14px 0 7px;display:flex;align-items:center;justify-content:space-between}
.gl:first-child{padding-top:4px}
.gl-n{background:var(--bg3);color:var(--t2);font-size:10px;font-weight:800;padding:2px 7px;border-radius:20px}

/* ── TASK CARD ───────────────────────────────── */
.tc{background:var(--bg2);border-radius:var(--r);padding:11px 12px;margin-bottom:6px;
  border:1.5px solid var(--bd);display:flex;align-items:flex-start;gap:10px;
  cursor:pointer;transition:all .13s;position:relative;overflow:hidden}
.tc::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px}
.tc.pr::before{background:var(--red)}.tc.py::before{background:var(--yel)}
.tc.pg::before{background:var(--grn)}.tc.pb::before{background:var(--blu)}
.tc:active{transform:scale(.985);background:var(--bg3)}
.tc-chk{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--bd2);
  flex-shrink:0;margin-top:2px;display:flex;align-items:center;justify-content:center;
  transition:all .2s;cursor:pointer}
.tc-chk.on{background:var(--grn);border-color:var(--grn)}
.tc-chk.on::after{content:'✓';font-size:11px;color:#000;font-weight:900}
.tc-body{flex:1;min-width:0}
.tc-title{font-size:14px;font-weight:600;color:var(--tx);line-height:1.35;word-break:break-word}
.tc-title.done{text-decoration:line-through;color:var(--t3)}
.tc-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.tag{font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px;white-space:nowrap}
.s0{background:var(--bg4);color:var(--t2)}.s1{background:var(--ybg);color:var(--yel)}
.s2{background:var(--bbg);color:var(--blu)}.s3{background:var(--gbg);color:var(--grn)}
.s4{background:var(--rbg);color:var(--red)}
.t-rem{background:var(--pbg);color:var(--pur)}
.tc-note{font-size:11px;color:var(--t3);margin-top:4px;line-height:1.4}

/* ── EMPTY ───────────────────────────────────── */
.empty{text-align:center;padding:50px 20px}
.empty-ic{font-size:40px;margin-bottom:12px}
.empty-t{font-size:15px;font-weight:700;color:var(--t2);margin-bottom:6px}
.empty-s{font-size:12px;color:var(--t3);line-height:1.5}

/* ── FAB ─────────────────────────────────────── */
.fab{position:fixed;bottom:calc(var(--nav-h) + 12px);right:16px;
  width:52px;height:52px;border-radius:16px;background:var(--blu);color:#fff;
  font-size:26px;display:flex;align-items:center;justify-content:center;
  box-shadow:0 6px 20px rgba(26,143,255,.4);z-index:99;cursor:pointer;border:none}
.fab:active{transform:scale(.92)}

/* ── MODAL ───────────────────────────────────── */
.ovl{position:fixed;inset:0;background:rgba(0,0,0,.82);z-index:200;
  display:flex;align-items:flex-end;opacity:0;pointer-events:none;transition:opacity .2s}
.ovl.on{opacity:1;pointer-events:all}
.sht{background:var(--bg2);border-radius:20px 20px 0 0;width:100%;
  max-height:94vh;overflow-y:auto;padding:0 0 32px;
  transform:translateY(100%);transition:transform .25s cubic-bezier(.4,0,.2,1)}
.sht::-webkit-scrollbar{display:none}
.ovl.on .sht{transform:translateY(0)}
.sh{width:36px;height:4px;background:var(--bg4);border-radius:2px;margin:10px auto 0}
.sht-hdr{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px}
.sht-ttl{font-size:17px;font-weight:800}
.sht-x{width:30px;height:30px;border-radius:50%;background:var(--bg3);
  display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--t2);cursor:pointer}
.ss{padding:0 16px 14px}
.sl{font-size:10px;font-weight:800;color:var(--t3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:7px}
.si{width:100%;background:var(--bg3);border:1.5px solid var(--bd);border-radius:var(--rs);
  padding:10px 12px;color:var(--tx);font-size:14px;font-weight:500;outline:none;
  transition:border-color .15s;resize:none;-webkit-appearance:none;appearance:none}
.si:focus{border-color:var(--blu)}.si::placeholder{color:var(--t3)}
.pr2{display:flex;gap:7px;flex-wrap:wrap}
.pch{padding:7px 12px;border-radius:9px;background:var(--bg3);font-size:12px;
  font-weight:700;color:var(--t2);cursor:pointer;border:1.5px solid transparent;transition:all .13s}
.pch.on{border-color:var(--blu);color:var(--blu);background:var(--bbg)}
.pbtn{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;
  justify-content:center;cursor:pointer;border:2.5px solid transparent;transition:all .13s;flex-shrink:0}
.pbtn.on{border-color:#fff;transform:scale(1.1)}
.psq{width:14px;height:14px;border-radius:4px}
.qdl{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:7px}
.qdlb{height:30px;padding:0 11px;border-radius:9px;background:var(--bg3);font-size:12px;
  font-weight:700;color:var(--t2);cursor:pointer;border:1.5px solid transparent;transition:all .13s;display:flex;align-items:center}
.qdlb.on{border-color:var(--blu);color:var(--blu);background:var(--bbg)}
.btn-s{margin:2px 16px 6px;width:calc(100% - 32px);height:48px;border-radius:12px;
  background:var(--blu);color:#fff;font-size:15px;font-weight:800;cursor:pointer;border:none}
.btn-s:active{opacity:.85}
.btn-d{margin:0 16px;width:calc(100% - 32px);height:40px;border-radius:10px;
  background:var(--rbg);color:var(--red);font-size:13px;font-weight:700;
  border:1px solid rgba(255,59,80,.15);cursor:pointer}
.btn-warn{margin:4px 16px 0;width:calc(100% - 32px);height:40px;border-radius:10px;
  background:var(--ybg);color:var(--yel);font-size:13px;font-weight:700;
  border:1px solid rgba(255,170,0,.2);cursor:pointer}

/* ── REPORT ──────────────────────────────────── */
.rc{background:var(--bg2);border-radius:var(--r);padding:13px;margin-bottom:9px;border:1.5px solid var(--bd)}
.rc-t{font-size:11px;font-weight:800;color:var(--t2);text-transform:uppercase;letter-spacing:.07em;margin-bottom:10px}
.rs-row{display:flex;gap:7px}
.rs{flex:1;background:var(--bg3);border-radius:10px;padding:9px 6px;text-align:center}
.rs-n{font-size:20px;font-weight:900}
.rs-l{font-size:9px;color:var(--t3);font-weight:700;text-transform:uppercase;margin-top:2px}
.rbar{height:4px;border-radius:2px;background:var(--bg3);margin:6px 0;overflow:hidden}
.rbar-f{height:100%;border-radius:2px;transition:width .5s}
.ri{display:flex;align-items:center;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--bd)}
.ri:last-child{border-bottom:none}

/* ── WORKOUT ─────────────────────────────────── */
.wc{background:var(--bg2);border-radius:var(--r);padding:12px;margin-bottom:8px;border:1.5px solid var(--bd);cursor:pointer}
.er{display:flex;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--bd)}
.er:last-child{border-bottom:none}
.en{font-size:13px;font-weight:600}.ep{font-size:10px;color:var(--t3);margin-top:2px}
.epills{display:flex;gap:4px}
.pill{background:var(--bg3);border-radius:5px;padding:3px 7px;font-size:10px;font-weight:800;color:var(--t2)}
.pill.up{color:var(--grn);background:var(--gbg)}.pill.dn{color:var(--red);background:var(--rbg)}

/* ── AUTO ────────────────────────────────────── */
.auto-item{display:flex;align-items:flex-start;gap:8px;padding:8px 0;border-bottom:1px solid var(--bd)}
.auto-item:last-child{border-bottom:none}

/* ── DONE PAGE ───────────────────────────────── */
.done-card{background:var(--bg2);border-radius:var(--r);padding:11px 13px;margin-bottom:6px;
  border:1.5px solid var(--bd);display:flex;align-items:flex-start;gap:10px;cursor:pointer}
.done-chk{width:20px;height:20px;border-radius:6px;background:var(--gbg);border:1.5px solid var(--grn);
  flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--grn);font-weight:900;margin-top:1px}
.done-body{flex:1;min-width:0}
.done-title{font-size:13px;font-weight:600;color:var(--t2);text-decoration:line-through;word-break:break-word}
.done-meta{font-size:10px;color:var(--t3);margin-top:3px;display:flex;gap:6px;flex-wrap:wrap}

/* ── SETTINGS ────────────────────────────────── */
.set-block{background:var(--bg2);border-radius:var(--r);padding:0 16px;border:1.5px solid var(--bd);margin-bottom:12px}
.set-row{display:flex;align-items:center;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--bd)}
.set-row:last-child{border-bottom:none}
.set-l{font-size:13px;font-weight:600}
.set-s{font-size:11px;color:var(--t3);margin-top:2px}
.cat-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--bd)}
.cat-row:last-child{border-bottom:none}
.cat-del{width:26px;height:26px;border-radius:8px;background:var(--rbg);color:var(--red);
  display:flex;align-items:center;justify-content:center;font-size:14px;cursor:pointer;flex-shrink:0;font-weight:800;border:none}
.tgl{width:42px;height:23px;border-radius:12px;background:var(--bg4);position:relative;cursor:pointer;transition:background .18s;flex-shrink:0}
.tgl.on{background:var(--blu)}
.tgl::after{content:'';width:17px;height:17px;border-radius:50%;background:#fff;position:absolute;top:3px;left:3px;transition:transform .18s}
.tgl.on::after{transform:translateX(19px)}

/* ── GUIDE ───────────────────────────────────── */
.g-sec{background:var(--bg2);border-radius:var(--r);padding:13px;margin-bottom:8px;border:1.5px solid var(--bd)}
.g-t{font-size:14px;font-weight:800;margin-bottom:9px}
.g-p{font-size:12px;color:var(--t2);line-height:1.65;margin-bottom:5px}
.g-step{display:flex;gap:9px;align-items:flex-start;margin-bottom:7px}
.g-num{width:20px;height:20px;border-radius:50%;background:var(--bbg);color:var(--blu);
  font-size:10px;font-weight:900;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.g-txt{font-size:12px;color:var(--t2);line-height:1.55;flex:1}

/* ── CHART ───────────────────────────────────── */
.chart-wrap{padding:4px 0 8px;overflow-x:auto;scrollbar-width:none}
.chart-wrap::-webkit-scrollbar{display:none}
.bar-chart{display:flex;align-items:flex-end;gap:4px;height:80px;padding:0 4px}
.bar-col{display:flex;flex-direction:column;align-items:center;gap:3px;flex:1;min-width:28px}
.bar{border-radius:4px 4px 0 0;width:100%;transition:height .4s;min-height:3px}
.bar-lbl{font-size:8px;color:var(--t3);font-weight:700;text-align:center}

/* ── TOAST ───────────────────────────────────── */
.toast{position:fixed;top:56px;left:50%;transform:translateX(-50%) translateY(-10px);
  background:rgba(38,38,47,.96);border:1px solid var(--bd2);color:var(--tx);
  padding:9px 16px;border-radius:12px;font-size:12px;font-weight:700;z-index:999;
  opacity:0;transition:all .25s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* ── TABLET / DESKTOP ────────────────────────── */
@media(min-width:600px){
  :root{--nav-h:56px}
  .dd{height:68px}
  .ws-wrap{padding:16px 24px 0}
  .qsbar{padding:10px 24px 0}
  .cf-wrap .cf-inner{padding:0 24px}
  .nav{padding:0 24px 8px}
  .nvi-ic{font-size:24px}
  .fab{right:24px}
}
@media(min-width:900px){
  #app{display:grid;grid-template-columns:340px 1fr;grid-template-rows:auto 1fr;gap:0;align-items:start}
  .ph{grid-column:1/-1}
  .left-col{grid-column:1;grid-row:2}
  .right-col{grid-column:2;grid-row:2;padding:0 24px 0 12px}
}
</style>
</head>
<body>
<div id="app"></div>
<nav class="nav" id="nav"></nav>
<button class="fab" id="fab" onclick="openNew()">＋</button>
<div class="ovl" id="ovl"><div class="sht" id="sht"></div></div>
<div class="toast" id="toast"></div>
<script>
// ═══════════════════════════════════════════════════════════
// CONSTANTS
// ═══════════════════════════════════════════════════════════
const DEFAULT_CATS=[
  {id:'tasks',    l:'Задачи',        c:'#1a8fff',bg:'rgba(26,143,255,.13)', parent:null},
  {id:'work',     l:'Работа',        c:'#90a4ae',bg:'rgba(144,164,174,.13)',parent:null},
  {id:'health',   l:'Здоровье',      c:'#ff3b50',bg:'rgba(255,59,80,.13)',  parent:null},
  {id:'auto',     l:'Авто',          c:'#e8c84a',bg:'rgba(232,200,74,.13)', parent:null},
  {id:'ideas',    l:'Размышления',   c:'#69f0ae',bg:'rgba(105,240,174,.13)',parent:null},
  {id:'shopping', l:'Покупки',       c:'#ff6b9d',bg:'rgba(255,107,157,.13)',parent:null},
  {id:'other',    l:'Прочее',        c:'#78909c',bg:'rgba(120,144,156,.13)',parent:null},
  {id:'payments', l:'Оплаты',        c:'#ffaa00',bg:'rgba(255,170,0,.13)',  parent:'tasks'},
  {id:'calls',    l:'Звонки',        c:'#26d467',bg:'rgba(38,212,103,.13)', parent:'tasks'},
  {id:'mail',     l:'Письма',        c:'#9b8dff',bg:'rgba(155,141,255,.13)',parent:'tasks'},
  {id:'docs',     l:'Документы',     c:'#ff7043',bg:'rgba(255,112,67,.13)', parent:'tasks'},

  {id:'questions',l:'Вопросы',       c:'#64b5f6',bg:'rgba(100,181,246,.13)',parent:'work'},

const today=()=>new Date().toISOString().slice(0,10);
const addDays=(n,base)=>{const d=base?new Date(base+'T00:00:00'):new Date();d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
const tomorrow=()=>addDays(1);

function fmtD(s){
  if(!s)return'';
  const d=new Date(s+'T00:00:00'),t=today(),tm=tomorrow(),y=addDays(-1);
  if(s===t)return'Сегодня';if(s===tm)return'Завтра';if(s===y)return'Вчера';
  return d.getDate()+' '+RUM[d.getMonth()];
}
function fmtDFull(s){if(!s)return'';const d=new Date(s+'T00:00:00');return d.getDate()+' '+RUM[d.getMonth()]+' '+d.getFullYear();}
function fmtDT(ts){if(!ts)return'';const d=new Date(ts);return d.getDate()+' '+RUMS[d.getMonth()]+' '+pad(d.getHours())+':'+pad(d.getMinutes());}
function pad(n){return String(n).padStart(2,'0')}
function isOver(t){return t.dl&&t.s!=='done'&&t.dl<today()}
function plural(n,a,b,c){if(n%10===1&&n%100!==11)return a;if([2,3,4].includes(n%10)&&![12,13,14].includes(n%100))return b;return c;}

// WEEK NAVIGATION

function getWeekDates(offset){
  const now=new Date();
  const dow=now.getDay();
  const monday=new Date(now);
  monday.setDate(now.getDate()-(dow===0?6:dow-1)+offset*7);
  const days=[];
  for(let i=0;i<7;i++){
    const d=new Date(monday);d.setDate(monday.getDate()+i);
    days.push(d.toISOString().slice(0,10));
  }
  return days;
}

function getWeekLabel(offset){
  const days=getWeekDates(offset);
  const first=new Date(days[0]+'T00:00:00');
  const last=new Date(days[6]+'T00:00:00');
  if(first.getMonth()===last.getMonth())
    return RUMF[first.getMonth()]+' '+first.getFullYear();
  return RUMS[first.getMonth()]+' – '+RUMS[last.getMonth()]+' '+last.getFullYear();
}

    </div>
    <div class="ws-days">`;
  weekDays.forEach(ds=>{
    const d=new Date(ds+'T00:00:00');
    const isTod=ds===today(),isSel=ds===A.selDate;
    const ts=A.tasks.filter(t=>t.s!=='done'&&(t.dl===ds||(t.dd===ds&&!t.dl)));
    const hasOvd=ts.some(t=>isOver(t));
    strip+=`<div class="dd${isSel?' sel':''}${isTod?' tod':''}${ts.length?(hasOvd?' ovd':' has'):''}" data-dt="${ds}">
      <span class="dw">${RUD[d.getDay()]}</span>
      <span class="dn">${d.getDate()}</span>
    </div>`;
  });
  strip+=`</div></div>`;

  // Stats for selected date
  const selTasks=A.tasks.filter(t=>t.s!=='done'&&(t.dl===A.selDate||(t.dd===A.selDate&&!t.dl)));
  const selDone=A.tasks.filter(t=>t.s==='done'&&(t.doneAt===A.selDate||t.dd===A.selDate)).length;
  const selOver=selTasks.filter(t=>isOver(t)).length;
  const qsbar=`<div class="qsbar">
    <div class="qs"><div class="qs-n" style="color:var(--yel)">${selTasks.length}</div><div class="qs-l">Активных</div></div>
    <div class="qs"><div class="qs-n" style="color:var(--red)">${selOver}</div><div class="qs-l">Просрочено</div></div>
    <div class="qs" onclick="setNav('report')"><div class="qs-n" style="color:var(--grn)">${selDone}</div><div class="qs-l">Готово →</div></div>
  </div>`;

  // Cat filter
  const activeCat=A.cats.find(c=>c.id===A.filterCat);
  const parentId=activeCat?.parent||A.filterCat;
  let cfHtml=`<div class="cf-wrap"><div class="cf-inner">`;
  cfHtml+=`<div class="cfc${A.filterCat==='all'?' on':''}" data-fc="all">Все</div>`;
  mainCats().forEach(c=>{
    const on=A.filterCat===c.id;
    cfHtml+=`<div class="cfc${on?' on':''}" data-fc="${c.id}" style="${on?'border-color:'+c.c+';color:'+c.c:''}"><span class="cdot" style="background:${c.c}"></span>${c.l}</div>`;
  });
  cfHtml+=`</div>`;
  // Subcats row
  const subs=activeCat&&!activeCat.parent?subCats(A.filterCat):activeCat?.parent?subCats(activeCat.parent):[];
  if(subs.length&&A.filterCat!=='all'){
    const par=A.cats.find(c=>c.id===parentId);
    cfHtml+=`<div class="cf-inner" style="padding-top:6px">`;
    cfHtml+=`<div class="cfc${A.filterCat===parentId?' on':''}" data-fc="${parentId}" style="${A.filterCat===parentId?'border-color:'+(par?.c||'#fff')+';color:'+(par?.c||'#fff'):''}">Все ${par?.l||''}</div>`;
    subs.forEach(s=>{ cfHtml+=`<div class="cfc${A.filterCat===s.id?' on':''}" data-fc="${s.id}" style="${A.filterCat===s.id?'border-color:'+s.c+';color:'+s.c:''}"><span class="cdot" style="background:${s.c}"></span>${s.l}</div>`; });
    cfHtml+=`</div>`;
  }
  cfHtml+=`</div>`;

  // Filter & group tasks
  let all=A.tasks.filter(t=>{
    if(t.s==='done')return false;
    if(A.filterCat==='all')return true;
    const cat=A.cats.find(c=>c.id===A.filterCat);if(!cat)return false;
    if(!cat.parent)return t.cat===A.filterCat||A.cats.filter(c=>c.parent===A.filterCat).some(s=>s.id===t.cat);
    return t.cat===A.filterCat;
  });
  if(!isToday) all=all.filter(t=>(t.dl===A.selDate)||(t.dd===A.selDate&&!t.dl));

  const overdue=all.filter(t=>isOver(t));
  const todayTs=all.filter(t=>!isOver(t)&&t.dl===today());
  const tmrwTs=all.filter(t=>!isOver(t)&&t.dl===tomorrow());
  const later=all.filter(t=>!isOver(t)&&t.dl&&t.dl!==today()&&t.dl!==tomorrow());
  const noDl=all.filter(t=>!isOver(t)&&!t.dl);

  let cnt=`<div class="pg">`;
  if(isToday){
    if(overdue.length){cnt+=glHdr('⚠️ Просрочено',overdue.length,'var(--red)');overdue.forEach(t=>{cnt+=card(t);});}
    if(todayTs.length){cnt+=glHdr('📅 Сегодня',todayTs.length,'var(--yel)');todayTs.forEach(t=>{cnt+=card(t);});}
    if(tmrwTs.length){cnt+=glHdr('⏭ Завтра',tmrwTs.length,'var(--blu)');tmrwTs.forEach(t=>{cnt+=card(t);});}
    if(later.length){cnt+=glHdr('📌 Запланировано',later.length);later.forEach(t=>{cnt+=card(t);});}
    if(noDl.length){cnt+=glHdr('📋 Без дедлайна',noDl.length);noDl.forEach(t=>{cnt+=card(t);});}
  } else {
    const d=new Date(A.selDate+'T00:00:00');
    if(all.length){cnt+=glHdr('📅 '+d.getDate()+' '+RUM[d.getMonth()],all.length);all.forEach(t=>{cnt+=card(t);});}
  }
  if(!all.length) cnt+=`<div class="empty"><div class="empty-ic">✨</div><div class="empty-t">${isToday?'На сегодня всё готово!':'Задач нет'}</div><div class="empty-s">Нажми ＋ чтобы добавить.</div></div>`;
  cnt+=`</div>`;

  // Ideas panel at bottom
  const ideas=A.tasks.filter(t=>t.cat==='ideas'&&t.s!=='done');
  let ideasPanel='';
  if(ideas.length&&A.filterCat==='all'){
    ideasPanel=`<div class="pg"><div class="gl" style="cursor:pointer" onclick="setFilter('ideas')"><span style="color:var(--grn)">💡 Размышления</span><span class="gl-n">${ideas.length}</span></div>
    <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px">`;
    ideas.slice(0,8).forEach(t=>{
      ideasPanel+=`<div style="background:rgba(105,240,174,.1);border:1px solid rgba(105,240,174,.2);border-radius:8px;padding:5px 10px;font-size:12px;font-weight:600;color:#69f0ae;cursor:pointer" onclick="openEdit(${t.id})">${t.title}</div>`;
    });
    if(ideas.length>8) ideasPanel+=`<div style="background:var(--bg2);border-radius:8px;padding:5px 10px;font-size:12px;color:var(--t3);cursor:pointer" onclick="setFilter('ideas')">ещё ${ideas.length-8}...</div>`;
    ideasPanel+=`</div></div>`;
  }

  const dayLabel=isToday?'Сегодня':RUDF[new Date(A.selDate+'T00:00:00').getDay()];
  const weather=A.weather?`<div style="font-size:13px;color:var(--t2);display:flex;align-items:center;gap:4px"><span>${A.weather.icon}</span><span>${A.weather.temp}°</span></div>`:'<div class="ibtn" onclick="fetchWeather()" style="font-size:11px;color:var(--t3)">🌤</div>';

  return `<div class="ph">
    <div class="ph-row">
      <span class="ph-label">Планировщик</span>
      <div class="ph-acts">${weather}</div>
    </div>
    <div class="ph-h1">${dayLabel}</div>
    <div class="ph-sub">${fmtDFull(A.selDate)}</div>
  </div>
  ${strip}${qsbar}${cfHtml}${cnt}${ideasPanel}`;
}

function setFilter(cat){ A.filterCat=cat; render(); }
function shiftWeek(d){
  A.weekOffset+=d;
  // If new week contains today, reset to today selection
  const days=getWeekDates(A.weekOffset);
  if(days.includes(today())) A.selDate=today();
  else A.selDate=days[0];
  render();
}

// ═══════════════════════════════════════════════════════════
// TASK CARD
// ═══════════════════════════════════════════════════════════
function glHdr(label,count,color){
  color=color||'var(--t3)';
  return `<div class="gl"><span style="color:${color}">${label}</span><span class="gl-n">${count}</span></div>`;
}

function card(t){
  const cat=getCat(t.cat),stat=getStat(t.s),pCls=PCLS[t.p]||'py';
  const isDone=t.s==='done',ovd=isOver(t);
  const hasRem=A.reminders[t.id];
  const catObj=A.cats.find(c=>c.id===t.cat);
  const parentCat=catObj&&catObj.parent?A.cats.find(c=>c.id===catObj.parent):null;
  let tags=`<div class="tc-tags">`;
  if(parentCat) tags+=`<span class="tag" style="background:${parentCat.bg};color:${parentCat.c}">${parentCat.l}</span>`;
  tags+=`<span class="tag" style="background:${cat.bg};color:${cat.c}">${cat.l}</span>`;
  tags+=`<span class="tag ${stat.cls}">${stat.l}</span>`;
  if(t.dl&&!isDone) tags+=`<span class="tag" style="color:${ovd?'var(--red)':'var(--t2)'};font-weight:${ovd?'800':'600'}">${ovd?'⚠️ Просрочено! ':fmtD(t.dl)}</span>`;
  if(hasRem) tags+=`<span class="tag t-rem">🔔 ${fmtDT(hasRem)}</span>`;
  tags+=`</div>`;
  const note=t.note?`<div class="tc-note">${t.note.slice(0,90)}${t.note.length>90?'…':''}</div>`:'';
  return `<div class="tc ${pCls}" onclick="openEdit(${t.id})">
    <div class="tc-chk${isDone?' on':''}" onclick="toggleDone(event,${t.id})"></div>
    <div class="tc-body"><div class="tc-title${isDone?' done':''}">${t.title}</div>${tags}${note}</div>
  </div>`;
}

// PAGE: WORKOUTS
// ═══════════════════════════════════════════════════════════
function pgWorkouts(){
  const tNames={chest:'💪 Грудь / Трицепс',back:'🔙 Спина / Бицепс',legs:'🦵 Ноги',arms:'💪 Руки',cardio:'🏃 Кардио'};
  const byType={};
  [...A.workouts].sort((a,b)=>b.date.localeCompare(a.date)).forEach(w=>{
    if(!byType[w.type])byType[w.type]=[];byType[w.type].push(w);
  });
  const wk=addDays(-7),weekWs=A.workouts.filter(w=>w.date>=wk);

  let html=`<div class="ph">
    <div class="ph-row"><span class="ph-label">Тренировки</span>
      <div class="ph-acts"><button class="ibtn" onclick="openNewWorkout()" style="opacity:.5;font-size:18px">✕</button><button class="ibtn" onclick="openNewWorkout()" style="font-size:18px;background:var(--blu);color:#fff">＋</button></div>
    </div>
    <div class="ph-h1">Прогресс</div>
    <div class="ph-sub">История и динамика</div>
  </div><div class="pg">`;

  html+=`<div class="rc"><div class="rc-t">Эта неделя</div><div class="rs-row">
    <div class="rs"><div class="rs-n" style="color:var(--blu)">${weekWs.length}</div><div class="rs-l">Тренировок</div></div>
    <div class="rs"><div class="rs-n" style="color:var(--grn)">${weekWs.reduce((s,w)=>s+w.exs.length,0)}</div><div class="rs-l">Упражнений</div></div>
    <div class="rs"><div class="rs-n" style="color:var(--yel)">${A.workouts.length}</div><div class="rs-l">Всего</div></div>
  </div></div>`;

  Object.keys(byType).forEach(type=>{
    const ws=byType[type],latest=ws[0],prev=ws[1];
    html+=glHdr(tNames[type]||type,ws.length);
    // Latest workout card (editable)
    html+=`<div class="wc" onclick="openEditWorkout('${latest.id}')">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:9px">
        <span style="font-size:11px;font-weight:800;color:var(--t2);text-transform:uppercase;letter-spacing:.06em">${fmtD(latest.date)}</span>
        ${prev?`<span style="font-size:10px;color:var(--t3)">пред: ${fmtD(prev.date)}</span>`:''}
      </div>`;
    latest.exs.forEach(ex=>{
      const pe=prev?prev.exs.find(e=>e.n===ex.n):null;
      const volC=ex.s*ex.r,volP=pe?pe.s*pe.r:0;
      const rCls=pe?(volC>volP?'up':volC<volP?'dn':''):'';
      const wCls=(pe&&ex.w>0)?(ex.w>pe.w?'up':ex.w<pe.w?'dn':''):'';
      const arr={up:'↑',dn:'↓','':''};
      html+=`<div class="er">
        <div><div class="en">${ex.n}</div>${pe?`<div class="ep">пред: ${pe.s}×${pe.r}${pe.w>0?' '+pe.w+'кг':''}</div>`:''}</div>
        <div class="epills">
          <span class="pill ${rCls}">${arr[rCls]||''}${ex.s}×${ex.r}</span>
          ${ex.w>0?`<span class="pill ${wCls}">${arr[wCls]||''}${ex.w}кг`:''}
        </div>
      </div>`;
    });
    html+=`</div>`;
    // History list (previous workouts)
    if(ws.length>1){
      html+=`<div style="margin-bottom:14px">`;
      ws.slice(1).forEach(w=>{
        html+=`<div style="display:flex;align-items:center;justify-content:space-between;padding:7px 12px;background:var(--bg2);border-radius:10px;margin-bottom:5px;cursor:pointer;border:1.5px solid var(--bd)" onclick="openEditWorkout('${w.id}')">
          <span style="font-size:13px;font-weight:600">${fmtDFull(w.date)}</span>
          <span style="font-size:11px;color:var(--t3)">${w.exs.length} упр.</span>
        </div>`;
      });
      html+=`</div>`;
    }
  });
  html+=`</div>`;
  return html;
}

// ═══════════════════════════════════════════════════════════
// PAGE: REPORT
// ═══════════════════════════════════════════════════════════
function pgReport(){
  const wkD=new Date();wkD.setDate(wkD.getDate()-wkD.getDay()+1);const wk=wkD.toISOString().slice(0,10);
  const mnD=new Date();mnD.setDate(1);const mn=mnD.toISOString().slice(0,10);
  const tasks=A.tasks,done=tasks.filter(x=>x.s==='done'),active=tasks.filter(x=>x.s!=='done');
  const wkDone=done.filter(x=>x.doneAt&&x.doneAt>=wk).length;
  const wkAdded=tasks.filter(x=>x.dd&&x.dd>=wk).length;
  const mnDone=done.filter(x=>x.doneAt&&x.doneAt>=mn).length;
  const mnAdded=tasks.filter(x=>x.dd&&x.dd>=mn).length;
  const pct=(a,b)=>b>0?Math.round(a/b*100):0;

  let html=`<div class="ph">
    <div class="ph-row"><span class="ph-label">Отчёт</span></div>
    <div class="ph-h1">Статистика</div>
    <div class="ph-sub">Прогресс и динамика</div>
  </div><div class="pg">`;

  // ── Task stats
  html+=`<div class="rc"><div class="rc-t">За эту неделю</div><div class="rs-row">
    <div class="rs"><div class="rs-n" style="color:var(--grn)">${wkDone}</div><div class="rs-l">Выполнено</div></div>
    <div class="rs"><div class="rs-n" style="color:var(--blu)">${wkAdded}</div><div class="rs-l">Добавлено</div></div>
    <div class="rs"><div class="rs-n" style="color:var(--t2)">${pct(wkDone,wkAdded)}%</div><div class="rs-l">Закрыто</div></div>
  </div></div>`;

  // Previous week comparison
  const prevWkD=new Date(wkD);prevWkD.setDate(prevWkD.getDate()-7);
  const prevWk=prevWkD.toISOString().slice(0,10);
  const prevWkDone=done.filter(x=>x.doneAt&&x.doneAt>=prevWk&&x.doneAt<wk).length;
  const prevWkAdded=tasks.filter(x=>x.dd&&x.dd>=prevWk&&x.dd<wk).length;
  const wkDiff=wkDone-prevWkDone;
  const wkArrow=wkDiff>0?'↑':wkDiff<0?'↓':'→';
  const wkColor=wkDiff>0?'var(--grn)':wkDiff<0?'var(--red)':'var(--t3)';
  html+=`<div class="rc" style="border-color:${wkDiff>0?'rgba(38,212,103,.2)':wkDiff<0?'rgba(255,59,80,.15)':'var(--bd)'}">
    <div class="rc-t">Сравнение с прошлой неделей</div>
    <div style="display:flex;align-items:center;justify-content:space-between">
      <div style="font-size:12px;color:var(--t2)">Прошлая неделя: <b>${prevWkDone}</b> выполнено</div>
      <div style="font-size:18px;font-weight:900;color:${wkColor}">${wkArrow} ${Math.abs(wkDiff)}</div>
    </div>
    <div class="rbar" style="margin-top:8px">
      <div class="rbar-f" style="width:${pct(wkDone,Math.max(wkDone,prevWkDone,1))}%;background:${wkColor}"></div>
    </div>
  </div>`;

  html+=`<div class="rc"><div class="rc-t">За этот месяц</div><div class="rs-row">
    <div class="rs"><div class="rs-n" style="color:var(--grn)">${mnDone}</div><div class="rs-l">Выполнено</div></div>
    <div class="rs"><div class="rs-n" style="color:var(--blu)">${mnAdded}</div><div class="rs-l">Добавлено</div></div>
    <div class="rs"><div class="rs-n" style="color:var(--t2)">${pct(mnDone,mnAdded)}%</div><div class="rs-l">Закрыто</div></div>
  </div></div>`;

  // ── Done tasks (moved from separate tab)
  const doneList=[...done].sort((a,b)=>(b.doneAt||'').localeCompare(a.doneAt||'')).slice(0,30);
  const groups={};
  doneList.forEach(t=>{const k=t.doneAt||t.dd||'';if(!groups[k])groups[k]=[];groups[k].push(t);});

  html+=`<div style="display:flex;align-items:center;justify-content:space-between;margin:16px 0 4px">
    <div class="gl" style="padding:0;flex:1"><span style="color:var(--grn)">✅ Выполненные задачи (${done.length})</span></div>
    ${done.length?`<button onclick="clearDone()" style="font-size:11px;font-weight:700;color:var(--red);padding:4px 10px;background:var(--rbg);border-radius:6px;border:none;cursor:pointer">Очистить</button>`:''}
  </div>`;

  if(!done.length){
    html+=`<div class="empty"><div class="empty-ic">✅</div><div class="empty-t">Пока ничего</div></div>`;
  } else {
    Object.entries(groups).sort((a,b)=>b[0].localeCompare(a[0])).forEach(([date,ts])=>{
      html+=glHdr(fmtD(date)||'Без даты',ts.length);
      ts.forEach(t=>{
        const cat=getCat(t.cat);
        html+=`<div class="done-card" onclick="openEdit(${t.id})">
          <div class="done-chk">✓</div>
          <div class="done-body">
            <div class="done-title">${t.title}</div>
            <div class="done-meta">
              <span style="background:${cat.bg};color:${cat.c};padding:1px 6px;border-radius:4px;font-weight:700">${cat.l}</span>
              ${t.doneAt?`<span>✓ ${fmtDFull(t.doneAt)}</span>`:''}
            </div>
          </div>
        </div>`;
      });
    });
  }

  // ── Workout stats
  const wkWorkouts=A.workouts.filter(w=>w.date>=wk);
  const mnWorkouts=A.workouts.filter(w=>w.date>=mn);

  html+=glHdr('💪 Тренировки',A.workouts.length);
  html+=`<div class="rc"><div class="rc-t">Статистика</div><div class="rs-row">
    <div class="rs"><div class="rs-n" style="color:var(--blu)">${wkWorkouts.length}</div><div class="rs-l">Эта неделя</div></div>
    <div class="rs"><div class="rs-n" style="color:var(--pur)">${mnWorkouts.length}</div><div class="rs-l">Этот месяц</div></div>
    <div class="rs"><div class="rs-n" style="color:var(--yel)">${A.workouts.length}</div><div class="rs-l">Всего</div></div>
  </div></div>`;

  // ── Workout chart (volume by date)
  const last8=A.workouts.slice(-8);
  if(last8.length){
    const maxVol=Math.max(...last8.map(w=>w.exs.reduce((s,e)=>s+e.s*e.r,0)));
    html+=`<div class="rc"><div class="rc-t">Объём тренировок</div><div class="chart-wrap"><div class="bar-chart">`;
    last8.forEach(w=>{
      const vol=w.exs.reduce((s,e)=>s+e.s*e.r,0);
      const h=maxVol>0?Math.round((vol/maxVol)*68):4;
      const d=new Date(w.date+'T00:00:00');
      const color=w.type==='chest'?'var(--blu)':'var(--pur)';
      html+=`<div class="bar-col">
        <div class="bar" style="height:${h}px;background:${color}"></div>
        <div class="bar-lbl">${d.getDate()}.${d.getMonth()+1}</div>
      </div>`;
    });
    html+=`</div></div></div>`;
  }

  // ── Workout dynamics
  const tNames={chest:'Грудь',back:'Спина',legs:'Ноги',arms:'Руки'};
  const byType={};
  A.workouts.forEach(w=>{if(!byType[w.type])byType[w.type]=[];byType[w.type].push(w);});
  if(Object.keys(byType).length){
    html+=`<div class="rc"><div class="rc-t">Динамика по группам</div>`;
    Object.entries(byType).forEach(([type,ws])=>{
      const sorted=[...ws].sort((a,b)=>a.date.localeCompare(b.date));
      const last=sorted[sorted.length-1],prev=sorted[sorted.length-2];
      if(!prev){html+=`<div class="ri"><span style="font-size:13px;font-weight:600">${tNames[type]||type}</span><span style="font-size:11px;color:var(--t3)">1 тренировка</span></div>`;return;}
      const volLast=last.exs.reduce((s,e)=>s+e.s*e.r,0);
      const volPrev=prev.exs.reduce((s,e)=>s+e.s*e.r,0);
      const diff=volLast-volPrev;
      const sign=diff>0?'↑':diff<0?'↓':'→';
      const col=diff>0?'var(--grn)':diff<0?'var(--red)':'var(--t3)';
      html+=`<div class="ri">
        <span style="font-size:13px;font-weight:600">${tNames[type]||type}</span>
        <span style="font-size:12px;font-weight:800;color:${col}">${sign} ${Math.abs(diff)} повт.</span>
      </div>`;
    });
    html+=`</div>`;
  }
  html+=`</div>`;
  return html;
}

// TASK SHEET
// ═══════════════════════════════════════════════════════════
function openNew(){
  A.edit={cat:A.filterCat!=='all'?A.filterCat:'tasks',p:'yellow',s:'todo',dl:A.selDate!==today()?A.selDate:'',note:''};
  showTaskSheet(false);
}
function openEdit(id){
  A.edit={...A.tasks.find(t=>t.id===id)};
  if(!A.edit.title){toast('Задача не найдена');return;}
  showTaskSheet(!!A.edit.id);
}

function showTaskSheet(isEdit){
  const e=A.edit||{},p=e.p||'yellow',st=e.s||'todo',cat=e.cat||'tasks';
  const remVal=A.reminders[e.id]?new Date(A.reminders[e.id]).toISOString().slice(0,16):'';
  const dl=e.dl||'';

  let pHtml=`<div style="display:flex;gap:8px">`;
  PRIOS.forEach(pr=>{
    pHtml+=`<div class="pbtn${p===pr.id?' on':''}" onclick="eSel('p','${pr.id}')" style="background:${pr.bg}"><div class="psq" style="background:${pr.c}"></div></div>`;
  });
  pHtml+=`</div>`;

  let sHtml=`<div class="pr2">`;
  STATS.forEach(s=>{sHtml+=`<div class="pch${st===s.id?' on':''}" onclick="eSel('s','${s.id}')">${s.l}</div>`;});
  sHtml+=`</div>`;

  let cHtml=`<div class="pr2" style="max-height:130px;overflow-y:auto">`;
  A.cats.forEach(c=>{
    const on=cat===c.id,pfx=c.parent?'↳ ':'';
    cHtml+=`<div class="pch${on?' on':''}" onclick="eSel('cat','${c.id}')" style="${on?'border-color:'+c.c+';color:'+c.c+';background:'+c.bg:''}">
      <span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:${c.c};margin-right:4px;vertical-align:middle"></span>${pfx}${c.l}</div>`;
  });
  cHtml+=`</div>`;

  const dlOpts=[{l:'Сегодня',v:today()},{l:'Завтра',v:tomorrow()},{l:'+3 дня',v:addDays(3)},{l:'+неделя',v:addDays(7)}];
  let qdHtml=`<div class="qdl">`;
  dlOpts.forEach(o=>{qdHtml+=`<div class="qdlb${dl===o.v?' on':''}" onclick="setDl('${o.v}')">${o.l}</div>`;});
  qdHtml+=`</div>`;

  // Resume button for done tasks
  const resumeBtn=isEdit&&e.s==='done'?`<button class="btn-warn" onclick="resumeTask(${e.id})">↩ Возобновить задачу</button>`:'';

  openSheet(`
    <div class="sht-hdr">
      <span class="sht-ttl">${isEdit?'Редактировать':'Новая задача'}</span>
      <div class="sht-x" onclick="closeSheet()">✕</div>
    </div>
    <div class="ss"><div class="sl">Название</div>
      <textarea class="si" id="fT" rows="2" placeholder="Что нужно сделать?">${e.title||''}</textarea>
    </div>
    <div class="ss"><div class="sl">Приоритет</div>${pHtml}</div>
    <div class="ss"><div class="sl">Статус</div>${sHtml}</div>
    <div class="ss"><div class="sl">Категория</div>${cHtml}</div>
    <div class="ss"><div class="sl">Дедлайн</div>${qdHtml}<input type="date" class="si" id="fDl" value="${dl}"></div>
    <div class="ss"><div class="sl">Напоминание</div><input type="datetime-local" class="si" id="fRem" value="${remVal}"></div>
    <div class="ss"><div class="sl">Заметка</div>
      <textarea class="si" id="fN" rows="2" placeholder="Дополнительно...">${e.note||''}</textarea>
    </div>
    <button class="btn-s" onclick="saveTask()">${isEdit?'Сохранить изменения':'Добавить задачу'}</button>
    ${resumeBtn}
    ${isEdit?`<button class="btn-d" onclick="delTask(${e.id})">🗑 Удалить задачу</button>`:''}
  `);
}

function eSel(f,v){if(!A.edit)return;A.edit[f]=v;showTaskSheet(!!A.edit.id);}
function setDl(v){if(!A.edit)return;A.edit.dl=A.edit.dl===v?'':v;showTaskSheet(!!A.edit.id);}

function saveTask(){
  const title=($('fT')?.value||'').trim();
  if(!title){toast('Введи название задачи');return;}
  const dl=$('fDl')?.value||'',note=($('fN')?.value||'').trim(),rem=$('fRem')?.value||'';
  const task={...A.edit,title,dl,note,dd:A.edit.dd||A.selDate||today()};
  if(task.id){
    const i=A.tasks.findIndex(t=>t.id===task.id);
    if(i!==-1)A.tasks[i]=task;
  } else {
    task.id=Date.now();A.tasks.push(task);
  }
  if(rem){A.reminders[task.id]=new Date(rem).getTime();schedRem(task.id,task.title,A.reminders[task.id]);}
  else delete A.reminders[task.id];
  saveState();closeSheet();render();
  toast(A.edit.id?'Задача обновлена ✓':'Задача добавлена ✓');
}

function delTask(id){
  if(!confirm('Удалить задачу?'))return;
  A.tasks=A.tasks.filter(t=>t.id!==id);
  delete A.reminders[id];
  saveState();closeSheet();render();toast('Задача удалена');
}

function toggleDone(e,id){
  e.stopPropagation();
  const t=A.tasks.find(t=>t.id===id);if(!t)return;
  t.s=t.s==='done'?'todo':'done';
  if(t.s==='done')t.doneAt=today();
  saveState();render();
}

function resumeTask(id){
  const t=A.tasks.find(t=>t.id===id);if(!t)return;
  t.s='todo';delete t.doneAt;
  saveState();closeSheet();render();toast('Задача возобновлена');
}

function clearDone(){
  if(!confirm('Удалить все выполненные?'))return;
  A.tasks=A.tasks.filter(t=>t.s!=='done');
  saveState();render();toast('Выполненные удалены');
}

function openNewWorkout(){
  const types=[{id:'chest',l:'💪 Грудь / Трицепс'},{id:'back',l:'🔙 Спина / Бицепс'},{id:'legs',l:'🦵 Ноги'},{id:'arms',l:'💪 Руки'}];
  let html=`<div class="sht-hdr"><span class="sht-ttl">Тип тренировки</span><div class="sht-x" onclick="closeSheet()">✕</div></div>
  <div class="ss"><div class="pr2" style="flex-direction:column">`;
  types.forEach(tp=>{
    const last=A.workouts.filter(w=>w.type===tp.id).sort((a,b)=>b.date.localeCompare(a.date))[0];
    html+=`<div class="pch" style="width:100%;display:flex;justify-content:space-between;align-items:center" onclick="openWorkoutForm('${tp.id}')">
      <span>${tp.l}</span>${last?`<span style="font-size:10px;color:var(--t3)">пред: ${fmtD(last.date)}</span>`:''}
    </div>`;
  });
  html+=`</div></div>`;
  openSheet(html);
}

function openWorkoutForm(type,wid){
  const existing=wid?A.workouts.find(w=>w.id===wid):null;
  const last=existing||A.workouts.filter(w=>w.type===type).sort((a,b)=>b.date.localeCompare(a.date))[0];
  const prev=wid?A.workouts.filter(w=>w.type===type&&w.id!==wid).sort((a,b)=>b.date.localeCompare(a.date))[0]:
    A.workouts.filter(w=>w.type===type).sort((a,b)=>b.date.localeCompare(a.date))[1];
  const initExs=last?last.exs:[{n:'',s:3,r:10,w:0}];
  let exHtml='';
  initExs.forEach((ex,i)=>{
    const pe=prev?prev.exs.find(e=>e.n===ex.n):null;
    exHtml+=`<div style="background:var(--bg3);border-radius:10px;padding:10px;margin-bottom:8px">
      <input class="si" style="margin-bottom:7px" placeholder="Упражнение" id="en${i}" value="${ex.n}">
      ${pe?`<div style="font-size:10px;color:var(--t3);margin-bottom:5px">пред: ${pe.s}×${pe.r}${pe.w>0?' '+pe.w+'кг':''}</div>`:''}
      <div style="display:flex;gap:6px">
        <div style="flex:1"><div style="font-size:9px;color:var(--t3);font-weight:800;text-transform:uppercase;margin-bottom:3px">Подходы</div>
          <input class="si" type="number" id="es${i}" value="${ex.s}"></div>
        <div style="flex:1"><div style="font-size:9px;color:var(--t3);font-weight:800;text-transform:uppercase;margin-bottom:3px">Повторения</div>
          <input class="si" type="number" id="er${i}" value="${ex.r}"></div>
        <div style="flex:1"><div style="font-size:9px;color:var(--t3);font-weight:800;text-transform:uppercase;margin-bottom:3px">Кг</div>
          <input class="si" type="number" id="ew${i}" value="${ex.w}"></div>
      </div>
    </div>`;
  });
  const prevLabel=prev?` (пред. ${fmtD(prev.date)})`:' (первая тренировка этого типа)';
  openSheet(`
    <div class="sht-hdr">
      <span class="sht-ttl">${wid?'Редактировать тренировку':'Новая тренировка'}</span>
      <div class="sht-x" onclick="closeSheet()">✕</div>
    </div>
    <div class="ss"><div class="sl">Дата</div>
      <input type="date" class="si" id="wDate" value="${existing?existing.date:today()}">
    </div>
    <div class="ss">
      <div class="sl">Упражнения${prevLabel}</div>
      <div id="exList">${exHtml}</div>
      <input type="hidden" id="wType" value="${type}">
      <input type="hidden" id="wId" value="${wid||''}">
      <input type="hidden" id="wCnt" value="${initExs.length}">
      <button onclick="addEx()" style="width:100%;height:38px;border-radius:9px;background:var(--bg3);color:var(--t2);font-size:12px;font-weight:700;margin-top:2px;border:none;cursor:pointer;font-family:inherit">＋ Добавить упражнение</button>
    </div>
    <button class="btn-s" onclick="saveWorkout()">${wid?'Сохранить изменения':'Сохранить тренировку'}</button>
    ${wid?`<button class="btn-d" onclick="delWorkout('${wid}')">🗑 Удалить тренировку</button>`:''}
  `);
}

function openEditWorkout(id){
  const w=A.workouts.find(w=>w.id===id);
  if(!w)return;
  openWorkoutForm(w.type,id);
}

function addEx(){
  const list=$('exList'),cnt=$('wCnt');if(!list||!cnt)return;
  const i=parseInt(cnt.value);
  list.insertAdjacentHTML('beforeend',`<div style="background:var(--bg3);border-radius:10px;padding:10px;margin-bottom:8px">
    <input class="si" style="margin-bottom:7px" placeholder="Упражнение" id="en${i}">
    <div style="display:flex;gap:6px">
      <div style="flex:1"><div style="font-size:9px;color:var(--t3);font-weight:800;text-transform:uppercase;margin-bottom:3px">Подходы</div><input class="si" type="number" id="es${i}" value="3"></div>
      <div style="flex:1"><div style="font-size:9px;color:var(--t3);font-weight:800;text-transform:uppercase;margin-bottom:3px">Повторения</div><input class="si" type="number" id="er${i}" value="10"></div>
      <div style="flex:1"><div style="font-size:9px;color:var(--t3);font-weight:800;text-transform:uppercase;margin-bottom:3px">Кг</div><input class="si" type="number" id="ew${i}" value="0"></div>
    </div>
  </div>`);
  cnt.value=i+1;
}

function saveWorkout(){
  const date=$('wDate')?.value||today();
  const type=$('wType')?.value||'chest';
  const wid=$('wId')?.value||'';
  const cnt=parseInt($('wCnt')?.value||'0');
  const exs=[];
  for(let i=0;i<cnt;i++){
    const n=($('en'+i)?.value||'').trim();if(!n)continue;
    exs.push({n,s:parseInt($('es'+i)?.value||3),r:parseInt($('er'+i)?.value||10),w:parseFloat($('ew'+i)?.value||0)});
  }
  if(!exs.length){toast('Добавь хотя бы одно упражнение');return;}
  if(wid){
    const i=A.workouts.findIndex(w=>w.id===wid);
    if(i!==-1)A.workouts[i]={...A.workouts[i],date,exs};
  } else {
    A.workouts.push({id:'w'+Date.now(),date,type,exs});
  }
  saveState();closeSheet();render();toast(wid?'Тренировка обновлена 💪':'Тренировка сохранена 💪');
}

function delWorkout(id){
  if(!confirm('Удалить тренировку?'))return;
  A.workouts=A.workouts.filter(w=>w.id!==id);
  saveState();closeSheet();render();toast('Тренировка удалена');
}

// ═══════════════════════════════════════════════════════════
// NOTION SYNC
// ═══════════════════════════════════════════════════════════
const NOTION_API='https://api.anthropic.com/v1/messages';

async function notionReq(method,path,body){
  const {key}=A.notion;
  const r=await fetch('https://api.notion.com/v1'+path,{
    method,
    headers:{'Authorization':'Bearer '+key,'Content-Type':'application/json','Notion-Version':'2022-06-28'},
    body:body?JSON.stringify(body):undefined
  });
  if(!r.ok){const e=await r.json();throw new Error(e.message||r.status);}
  return r.json();
}

// Map our priority → Notion select
const PRIO_TO_NOTION={red:'🔴 Высокий',yellow:'🟡 Средний',green:'🟢 Низкий',blue:'🔵 Инфо'};
const NOTION_TO_PRIO={'🔴 Высокий':'red','🟡 Средний':'yellow','🟢 Низкий':'green','🔵 Инфо':'blue'};
const STAT_TO_NOTION={todo:'📋 К выполнению',doing:'⏳ В процессе',wait:'📨 Ожидаю ответа',done:'✅ Выполнено',over:'⚠️ Просрочено'};
const NOTION_TO_STAT={'📋 К выполнению':'todo','⏳ В процессе':'doing','📨 Ожидаю ответа':'wait','✅ Выполнено':'done','⚠️ Просрочено':'over'};

function taskToNotionProps(t){
  const cat=getCat(t.cat);
  const props={
    'Задача':{title:[{text:{content:t.title}}]},
    'Статус':{select:{name:STAT_TO_NOTION[t.s]||'📋 К выполнению'}},
    'Приоритет':{select:{name:PRIO_TO_NOTION[t.p]||'🟡 Средний'}},
    'Категория':{select:{name:cat.l}},
  };
  if(t.dl) props['Дедлайн']={date:{start:t.dl}};
  if(t.note) props['Заметки']={rich_text:[{text:{content:t.note.slice(0,2000)}}]};
  return props;
}

function notionPageToTask(page){
  const pr=page.properties;
  const title=pr['Задача']?.title?.[0]?.text?.content||'';
  if(!title)return null;
  return{
    id:page.id.replace(/-/g,''),
    notionId:page.id,
    title,
    s:NOTION_TO_STAT[pr['Статус']?.select?.name]||'todo',
    p:NOTION_TO_PRIO[pr['Приоритет']?.select?.name]||'yellow',
    cat:A.cats.find(c=>c.l===pr['Категория']?.select?.name)?.id||'other',
    dl:pr['Дедлайн']?.date?.start||'',
    note:pr['Заметки']?.rich_text?.[0]?.text?.content||'',
    dd:today(),
    doneAt:pr['Статус']?.select?.name==='✅ Выполнено'?today():'',
  };
}

async function syncToNotion(){
  const{key,dbId}=A.notion;
  if(!key||!dbId){toast('Настрой Notion в ⚙️ Настройках');return;}
  A._syncing=true;render();
  try{
    const activeTasks=A.tasks.filter(t=>!t.notionId&&t.s!=='done').slice(0,50);
    let pushed=0;
    for(const t of activeTasks){
      const res=await notionReq('POST','/pages',{parent:{database_id:dbId},properties:taskToNotionProps(t)});
      t.notionId=res.id;
      pushed++;
    }
    // Update existing
    const updatedTasks=A.tasks.filter(t=>t.notionId);
    for(const t of updatedTasks){
      await notionReq('PATCH','/pages/'+t.notionId,{properties:taskToNotionProps(t)});
    }
    saveState();
    toast('Notion: отправлено '+pushed+' задач ✓');
  }catch(e){toast('Ошибка Notion: '+e.message);}
  A._syncing=false;render();
}

async function syncFromNotion(){
  const{key,dbId}=A.notion;
  if(!key||!dbId){toast('Настрой Notion в ⚙️ Настройках');return;}
  A._syncing=true;render();
  try{
    const res=await notionReq('POST','/databases/'+dbId+'/query',{page_size:100});
    let imported=0,updated=0;
    for(const page of res.results){
      const t=notionPageToTask(page);
      if(!t)continue;
      const existing=A.tasks.find(x=>x.notionId===page.id);
      if(existing){Object.assign(existing,t,{id:existing.id});updated++;}
      else{t.id=Date.now()+Math.random();A.tasks.push(t);imported++;}
    }
    saveState();
    toast('Notion: получено '+imported+' новых, обновлено '+updated+' ✓');
  }catch(e){toast('Ошибка Notion: '+e.message);}
  A._syncing=false;render();
}

async function fullSync(){
  await syncToNotion();
  await syncFromNotion();
}

// WEATHER

async function fetchWeather(){
  try{
    const pos=await new Promise((res,rej)=>navigator.geolocation.getCurrentPosition(res,rej,{timeout:5000}));
    const {latitude:lat,longitude:lon}=pos.coords;
    const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`);
    const data=await r.json();
    const wc=data.current_weather.weathercode;
    const temp=Math.round(data.current_weather.temperature);
    const icons={0:'☀️',1:'🌤',2:'⛅',3:'☁️',45:'🌫',48:'🌫',51:'🌦',61:'🌧',71:'🌨',80:'🌦',95:'⛈',99:'⛈'};
    const icon=icons[wc]||icons[Math.floor(wc/10)*10]||'🌡';
    A.weather={temp,icon};render();
  }catch(e){toast('Не удалось получить погоду');}
}

function openSheet(html){
  $('sht').innerHTML='<div class="sh"></div>'+html;
  $('ovl').classList.add('on');
  setTimeout(()=>{$('sht').scrollTop=0;},50);
}
function closeSheet(){
  $('ovl').classList.remove('on');
  setTimeout(()=>{$('sht').innerHTML='';},280);
}
function schedRem(id,title,ts){
  if(!('Notification' in window))return;
  const delay=ts-Date.now();if(delay<=0)return;
  const fire=()=>new Notification('Планировщик',{body:title});
  if(Notification.permission==='granted')setTimeout(fire,delay);
  else if(Notification.permission!=='denied')Notification.requestPermission().then(p=>{if(p==='granted')setTimeout(fire,delay);});
}
function restoreRems(){
  const now=Date.now();
  Object.entries(A.reminders).forEach(([id,ts])=>{
    const t=A.tasks.find(t=>String(t.id)===String(id));
    if(t&&ts>now)schedRem(id,t.title,ts);
  });
}
function setNav(n){A.nav=n;render();}
function toast(msg){
  const el=$('toast');el.textContent=msg;el.classList.add('on');
  clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('on'),2400);
}
function bind(){
  document.querySelectorAll('[data-dt]').forEach(el=>{
    el.addEventListener('click',()=>{A.selDate=el.dataset.dt;render();});
  });
  document.querySelectorAll('[data-fc]').forEach(el=>{
    el.addEventListener('click',()=>{A.filterCat=el.dataset.fc;render();});
  });
  $('ovl')?.addEventListener('click',e=>{if(e.target===$('ovl'))closeSheet();});
}

// ── PWA Service Worker (inline) ──────────────────────────
if('serviceWorker' in navigator){
  const swCode=`
self.addEventListener('install',e=>self.skipWaiting());
self.addEventListener('activate',e=>e.waitUntil(clients.claim()));
self.addEventListener('fetch',e=>{
  if(e.request.method!=='GET')return;
  e.respondWith(caches.open('pln-v1').then(async cache=>{
    const cached=await cache.match(e.request);
    if(cached)return cached;
    try{const res=await fetch(e.request);cache.put(e.request,res.clone());return res;}
    catch{return cached||new Response('Offline',{status:503});}
  }));
});`;
  const blob=new Blob([swCode],{type:'application/javascript'});
  const swUrl=URL.createObjectURL(blob);
  navigator.serviceWorker.register(swUrl).catch(()=>{});
}
